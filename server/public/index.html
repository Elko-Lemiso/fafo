<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fafo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFC53D'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-weight='900' font-size='20' text-anchor='middle' fill='%231D140F'%3EF%3C/text%3E%3C/svg%3E">
<!-- Fonts are served by the laptop so the game looks right even on a Wi-Fi with no internet. -->
<link rel="stylesheet" href="/fonts/bungee/index.css">
<link rel="stylesheet" href="/fonts/barlow/500.css">
<link rel="stylesheet" href="/fonts/barlow/600.css">
<link rel="stylesheet" href="/fonts/barlow/700.css">
<link rel="stylesheet" href="/fonts/barlow/800.css">
<link rel="stylesheet" href="/fonts/barlow-condensed/600.css">
<link rel="stylesheet" href="/fonts/barlow-condensed/700.css">
<style>
/* Layout: game-show set on a halftone marigold ground. TV = full-bleed 16:9 stage, phone = one-column controller. */
:root{
  --sun:#FFC53D; --sun-deep:#EBA61A; --ink:#1D140F; --ink-soft:#5A4630; --paper:#FFFBF0; --photo-bg:#2A211B;
  --tomato:#D93A26; --cobalt:#2342C6; --mint:#11704F;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--sun);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;
  background-image:radial-gradient(circle,var(--sun-deep) 1.1px,transparent 1.7px);background-size:16px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{height:100%}
h1,h2,h3,p,ul,ol,figure{margin:0}
h1,h2{text-wrap:balance}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--cobalt);outline-offset:3px}
.eyebrow{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;padding:.85em 1.3em;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--tomato);color:var(--paper)}
.btn.blue{background:var(--cobalt);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:.8rem;padding:.55em .95em;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;font-family:var(--body);font-weight:700;padding:.4em .6em}

/* avatars + prints */
.avatar{display:inline-grid;place-items:center;width:2.4em;height:2.4em;border-radius:50%;background:var(--c);color:#FFFBF0;
  font-family:var(--display);border:3px solid var(--ink);flex:none;line-height:1}
.print{display:inline-flex;flex-direction:column;background:var(--paper);padding:1.6vmin 1.6vmin 0;border:3px solid var(--ink);
  box-shadow:1vmin 1.2vmin 0 var(--ink);transform:rotate(-2deg);max-width:100%}
.print img{display:block;max-width:100%;max-height:60vmin;width:auto;height:auto;background:var(--photo-bg);object-fit:contain}
.print figcaption{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:2.2vmin;padding:1.4vmin 0 1.6vmin;color:var(--ink-soft)}

/* landing */
.landing{min-height:100%;max-width:1040px;margin:0 auto;padding-block:clamp(28px,7vh,80px);display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.wordmark{font-family:var(--display);font-size:clamp(64px,12vw,148px);line-height:.86;letter-spacing:-.01em}
.wordmark span{display:block}
.wordmark .two{color:var(--paper);-webkit-text-stroke:.03em var(--ink);paint-order:stroke fill;text-shadow:.045em .055em 0 var(--ink);margin-left:.35em}
.wordmark.fafo{font-size:clamp(84px,17vw,200px);line-height:1}
.wordmark.fafo span{display:inline}
.wordmark.fafo .two{margin-left:.03em}
.lobby .wordmark.fafo{font-size:17vmin}
.lede{font-size:clamp(18px,2.1vw,22px);line-height:1.45;max-width:38ch;margin-top:24px;font-weight:600}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:18px}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);width:1.8em;height:1.8em;display:grid;place-items:center;background:var(--sun);border:2px solid var(--ink);border-radius:50%}
.warn{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;line-height:1.4}
@media (max-width:760px){.landing{grid-template-columns:minmax(0,1fr)}}

/* ---------- TV ---------- */
.tv{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2vmin;padding-block:2.4vmin;max-width:2000px;margin:0 auto}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:max(18px,3.4vmin)}
.tv[data-ph=lobby] .tv-top .logo{visibility:hidden}
.tv-status{display:flex;gap:1.2vmin;align-items:center;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:max(13px,2vmin)}
.pill{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:.35em .9em}
.pill.dark{background:var(--ink);color:var(--paper)}
.stage{min-height:0;position:relative}
.hostbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:40px}
.hostbar .why{font-weight:700;color:var(--ink-soft)}

.lobby{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vmin;align-items:center}
.lobby .wordmark{font-size:12vmin}
.lobby .lede{font-size:max(15px,2.5vmin);margin-top:2.4vmin;max-width:34ch}
.joincard{margin-top:4vmin;display:flex;gap:3vmin;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:2vmin;
  box-shadow:0 1vmin 0 var(--ink);padding:2.4vmin;width:fit-content;max-width:100%;transform:rotate(-1.2deg)}
.qr svg{width:max(140px,min(27vmin,19vw));height:max(140px,min(27vmin,19vw));display:block}
.code{font-family:var(--display);font-size:clamp(30px,min(9vmin,5vw),130px);letter-spacing:.06em;line-height:1}
.joincard .small{font-size:max(13px,2vmin);color:var(--ink-soft);max-width:22ch;line-height:1.35;margin-top:1vmin}
.roster{align-self:stretch;display:flex;flex-direction:column;gap:2vmin;min-height:0;justify-content:center}
.roster-head{display:flex;justify-content:space-between;align-items:baseline}
.roster-head h2{font-family:var(--display);font-size:max(22px,4.4vmin)}
.roster-head .count{font-family:var(--display);font-size:max(16px,3vmin)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vmin}
.pcard{display:flex;align-items:center;gap:1.4vmin;background:var(--paper);border:3px solid var(--ink);border-radius:1.6vmin;padding:1.1vmin 1.4vmin;font-size:max(14px,2.5vmin);min-width:0}
.pcard.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.pcard.off{opacity:.5}
.pc-body{display:flex;flex-direction:column;min-width:0;flex:1}
.pc-body .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-body .meta{font-family:var(--label);font-weight:600;font-size:.78em;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addph{flex:none;font-family:var(--label);font-weight:700;font-size:.72em;text-transform:uppercase;letter-spacing:.06em;background:transparent;border:2px dashed var(--ink-soft);border-radius:8px;padding:.3em .6em;cursor:pointer;color:var(--ink-soft)}
.empty{border:3px dashed var(--ink-soft);border-radius:2vmin;padding:4vmin;text-align:center;font-size:max(15px,2.6vmin);font-weight:700;color:var(--ink-soft)}
.film{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(14px,3.4vmin),1fr));gap:.6vmin;background:var(--ink);padding:1.1vmin .9vmin;border-radius:.8vmin;position:relative}
.film::before,.film::after{content:"";position:absolute;left:.9vmin;right:.9vmin;height:.5vmin;background:repeating-linear-gradient(90deg,var(--paper) 0 1vmin,transparent 1vmin 2.2vmin);opacity:.7}
.film::before{top:.3vmin}.film::after{bottom:.3vmin}
.frame{aspect-ratio:4/3;border-radius:.3vmin;background:#3A2E26;border:1px solid #4D3E33}
.frame.on{background:var(--sun);border-color:var(--sun)}
.filmcap{font-size:max(13px,2.1vmin);font-weight:700}
.points-key{font-size:max(12px,1.9vmin);color:var(--ink-soft);line-height:1.4}

.qgrid,.rgrid{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:5vmin;align-items:center}
.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.qphoto{display:grid;place-items:center;min-height:0;position:relative;height:100%}
.qphoto .print{animation:deal .6s cubic-bezier(.2,1.2,.4,1) both}
.rgrid .print img{max-height:52vmin}
.qside,.rside{display:flex;flex-direction:column;gap:2.2vmin;min-width:0}
.qtitle{font-family:var(--display);font-size:max(26px,6.4vmin);line-height:.98}
.clock{position:relative;width:max(90px,17vmin);height:max(90px,17vmin)}
.clock svg{width:100%;height:100%;display:block}
.clock .bg{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.clock .ring{fill:none;stroke:var(--tomato);stroke-width:9;stroke-dasharray:100;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.clock span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:max(30px,6.4vmin)}
.clock.hurry span{color:var(--tomato);animation:throb .5s ease-in-out infinite alternate}
.locks{display:flex;flex-wrap:wrap;gap:1.1vmin}
.lock{display:flex;align-items:center;gap:.9vmin;padding:.6vmin 1.3vmin .6vmin .6vmin;border:2px dashed var(--ink-soft);border-radius:999px;font-weight:800;font-size:max(13px,2.2vmin);color:var(--ink-soft)}
.lock .avatar{font-size:.8em;border-width:2px}
.lock.in{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.lock.owner{opacity:.55}
.locks .dot{width:max(16px,3vmin);height:max(16px,3vmin);border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.locks .dot.in{background:var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.votes{font-family:var(--display);font-weight:400;font-size:.85em;white-space:nowrap;animation:drop .35s cubic-bezier(.3,1.5,.5,1) both}

.intro{height:100%;display:grid;place-items:center;text-align:center;align-content:center;gap:2vmin}
.intro .big{font-family:var(--display);font-size:max(48px,16vmin);line-height:.9;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.dbl{font-family:var(--display);font-size:max(20px,4.4vmin);background:var(--tomato);color:var(--paper);padding:.3em .8em;border:3px solid var(--ink);border-radius:1vmin;transform:rotate(-3deg);box-shadow:0 .7vmin 0 var(--ink)}

.rows{display:flex;flex-direction:column;gap:1.3vmin}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.4vmin;background:var(--paper);border:3px solid var(--ink);border-radius:1.4vmin;padding:1vmin 1.4vmin;font-size:max(15px,2.8vmin);font-weight:800}
.rows li.win{animation:win .5s var(--t,2.2s) both}
.rows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voters{display:flex;gap:.5vmin;flex-wrap:wrap;justify-content:flex-end}
.voters>span{display:inline-flex;animation:drop .35s cubic-bezier(.3,1.5,.5,1) both}
.voters .avatar{font-size:.62em;border-width:2px}
.stamp{position:absolute;left:50%;top:50%;font-family:var(--display);font-size:max(26px,7.4vmin);color:var(--paper);background:var(--cobalt);padding:.15em .5em;border:4px solid var(--ink);
  border-radius:1vmin;white-space:nowrap;box-shadow:0 1vmin 0 var(--ink);animation:stamp .45s var(--t,2.2s) cubic-bezier(.2,1.4,.4,1) both;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.deltas{display:flex;flex-wrap:wrap;gap:1vmin;animation:rise .4s var(--t2,3s) both}
.delta{display:flex;align-items:center;gap:.8vmin;background:var(--ink);color:var(--paper);border-radius:999px;padding:.5vmin 1.4vmin .5vmin .5vmin;font-weight:800;font-size:max(13px,2.2vmin)}
.delta .avatar{font-size:.75em;border-width:2px;border-color:var(--paper)}
.delta b{font-family:var(--display);font-weight:400;color:var(--sun)}
.nobody{font-size:max(15px,2.8vmin);font-weight:800}

.board{height:100%;display:flex;flex-direction:column;justify-content:center;gap:3vmin;max-width:1300px;margin:0 auto;width:100%}
.lb{display:flex;flex-direction:column;gap:1.3vmin}
.lb li{display:grid;grid-template-columns:5vmin auto minmax(0,1fr) auto;align-items:center;gap:1.6vmin;font-size:max(15px,2.9vmin);font-weight:800;animation:rise .4s both}
.lb .rank{font-family:var(--display);text-align:right}
.bar{height:4.6vmin;min-width:0;display:flex;align-items:center}
.bar i{display:block;height:100%;width:var(--w);min-width:1.2vmin;background:var(--c);border:3px solid var(--ink);border-radius:1vmin;animation:grow .8s .2s cubic-bezier(.2,1,.3,1) both;transform-origin:left}
.bar span{margin-left:1.2vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .score{font-family:var(--display);font-weight:400}
.lb .up{font-family:var(--label);color:var(--mint);font-size:.8em;margin-left:.6vmin}

.end{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center}
.end .qtitle{font-size:max(30px,8vmin)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,22vmin));align-items:end;gap:2vmin}
.step{display:flex;flex-direction:column;align-items:center;gap:1.2vmin;min-width:0}
.step .avatar{font-size:max(16px,3.4vmin)}
.step .nm{font-weight:800;font-size:max(14px,2.8vmin);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:1.2vmin 1.2vmin 0 0;display:grid;place-items:center;font-family:var(--display);font-size:max(18px,5vmin);box-shadow:0 1vmin 0 var(--ink);animation:grow-up .7s cubic-bezier(.2,1.2,.4,1) both;transform-origin:bottom}
.block small{display:block;font-size:.42em;font-family:var(--body);font-weight:800}
.p1 .block{height:24vmin;background:var(--sun)}.p2 .block{height:16vmin;animation-delay:.25s}.p3 .block{height:11vmin;animation-delay:.4s}
.rest{display:flex;flex-wrap:wrap;gap:1vmin 2.4vmin;justify-content:center;font-weight:700;font-size:max(13px,2.3vmin)}

@media (max-width:760px){
  .lobby,.qgrid,.rgrid{grid-template-columns:minmax(0,1fr);height:auto;gap:24px}
  .tv{height:auto;min-height:100%}
}

/* ---------- phone ---------- */
.phone{max-width:520px;margin:0 auto;min-height:100%;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.ph-top{display:flex;align-items:center;gap:8px;min-height:44px}
.ph-top .logo{font-size:17px;white-space:nowrap}
.ph-top .room{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;margin-left:auto;white-space:nowrap}
.ph-top .btn.ghost{font-size:14px;padding:.3em .4em}
.ph-top .avatar{font-size:13px;border-width:2px}
.ph-main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.center{text-align:center;align-items:center}
.ph-h{font-family:var(--display);font-size:26px;line-height:1.05}
.ph-big{font-family:var(--display);font-size:40px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.field input{font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
.field input.code-in{font-family:var(--display);letter-spacing:.15em;text-transform:uppercase}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--photo-bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .st{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .st i{position:absolute;left:0;top:0;bottom:0;background:var(--cobalt);width:var(--p,0%);transition:width .2s}
.thumb .st span{position:relative}
.thumb.done .st{background:var(--mint)}
.thumb.bad .st{background:var(--tomato)}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1}
.addtile{aspect-ratio:1;border:3px dashed var(--ink);border-radius:10px;background:transparent;display:grid;place-items:center;font-family:var(--display);font-size:15px;cursor:pointer;text-align:center;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px;background:#fff;max-width:100%}
.chip .avatar{font-size:11px;border-width:2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:19px;cursor:pointer;text-align:left;min-width:0}
.choice span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice .avatar{font-size:13px}
.tbar{height:12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--tomato);width:100%;transition:width .25s linear}
.result{padding:28px 18px}
.result.good{background:var(--cobalt);color:var(--paper)}
.result.bad{background:var(--tomato);color:var(--paper)}
.result.good .eyebrow,.result.bad .eyebrow{color:var(--paper);opacity:.8}
.hostlist{display:flex;flex-direction:column;gap:10px}

/* round picker + flag and map rounds */
.modes{display:flex;flex-direction:column;gap:1vmin}
.mode-row{display:flex;flex-wrap:wrap;gap:1vmin}
.mode{font-family:var(--display);font-size:max(13px,2.1vmin);padding:.5em .9em;border:3px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.mode.on{background:var(--ink);color:var(--sun)}
.print img.flag{width:62vmin;max-width:100%;height:auto;max-height:none;aspect-ratio:4/3;object-fit:cover;background:var(--paper)}
.print .shape{display:block;width:62vmin;max-width:100%;height:auto;aspect-ratio:4/3}
.print .shape path{fill:var(--ink)}
.print .loading{display:grid;place-items:center;width:min(64vmin,100%);aspect-ratio:4/3;font-weight:800;color:var(--ink-soft)}

.settings{position:fixed;inset:0;z-index:18;display:grid;place-items:center;padding:3vmin;background:rgba(29,20,15,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

.settings-card{background:var(--sun);border:3px solid var(--ink);border-radius:2vmin;box-shadow:0 1vmin 0 var(--ink);width:min(1250px,100%);max-height:100%;overflow-y:auto;padding:2.6vmin 3vmin;display:flex;flex-direction:column;gap:1.6vmin}
.settings-head{display:flex;justify-content:space-between;align-items:center;gap:2vmin}

.mgroup{display:grid;grid-template-columns:max(110px,15vmin) minmax(0,1fr);gap:1.4vmin;align-items:start}

@media (max-width:760px){.mgroup{grid-template-columns:minmax(0,1fr)}}
.mixnote{width:100%;font-size:max(11px,1.7vmin);font-weight:700;color:var(--ink-soft)}

.vinyl span{width:34%;aspect-ratio:1;border-radius:50%;background:var(--tomato);display:grid;place-items:center;font-family:var(--display);font-size:max(24px,6vmin);color:var(--paper);border:3px solid var(--ink)}
.vinyl.spin{animation:spin 2.4s linear infinite}
.print img.cover{width:46vmin;max-width:100%;height:auto;aspect-ratio:1;object-fit:cover;max-height:none}
.print.song figcaption{display:flex;flex-direction:column;gap:.4vmin;text-transform:none;letter-spacing:0;font-family:var(--body);color:var(--ink);max-width:min(48vmin,100%)}
.print.song figcaption b{font-weight:800;font-size:max(15px,3vmin);line-height:1.1}
.print.song figcaption span{font-weight:700;font-size:max(13px,2.3vmin);color:var(--ink-soft)}

.rgrid .print img.face{height:46vmin}
.rgrid .print img.cover,.rgrid .vinyl{width:38vmin}
.who-d{font-weight:700;color:var(--ink-soft);font-size:max(13px,2.2vmin);animation:rise .4s var(--t2,3s) both}
.credit{font-size:max(10px,1.5vmin);color:var(--ink-soft)}
.songsearch{display:flex;gap:8px}
.songsearch input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.songlist{display:flex;flex-direction:column;gap:8px}
.songrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px;border:2px solid var(--ink);border-radius:12px;background:#fff}

.songrow img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--photo-bg)}

.award b{display:block;font-family:var(--display);font-weight:400;font-size:max(14px,2.4vmin)}
.award span{font-weight:700;font-size:max(12px,1.9vmin);color:var(--ink-soft)}
.imp{height:100%;display:flex;flex-direction:column;justify-content:center;gap:2.4vmin;max-width:1300px;margin:0 auto;width:100%}
.imp .lede{font-size:max(15px,3vmin);max-width:46ch;margin:0}
.speaker{display:flex;align-items:center;gap:3vmin}
.speaker .avatar{font-size:max(28px,7vmin);border-width:5px}
.big-name{font-family:var(--display);font-size:max(40px,12vmin);line-height:.9;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.turns{display:flex;flex-wrap:wrap;gap:1.2vmin}
.turns li{display:flex;align-items:center;gap:.8vmin;padding:.5vmin 1.3vmin .5vmin .5vmin;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:800;font-size:max(13px,2.2vmin)}
.turns li.done{opacity:.45}
.turns li.now{background:var(--ink);color:var(--paper)}
.turns .avatar{font-size:.8em;border-width:2px}
.bigav{align-content:center;gap:2vmin}
.bigav .avatar{font-size:max(48px,16vmin);border-width:6px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.words{display:flex;flex-wrap:wrap;gap:1vmin 3vmin;font-size:max(15px,2.8vmin);font-weight:700;animation:rise .4s var(--t,2s) both}
.words b{font-family:var(--display);font-weight:400}
.secret{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:26px 18px;border:3px dashed var(--ink);border-radius:18px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:center}
.secret b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05}
.secret span{font-weight:700;color:var(--ink-soft)}
.secret.on{border-style:solid;background:var(--ink);color:var(--sun)}
.secret.on span{color:var(--paper)}
.tgrid{height:100%;display:flex;flex-direction:column;justify-content:center;gap:3vmin;max-width:1500px;margin:0 auto;width:100%}
.tqt{font-family:var(--body);font-weight:800;font-size:max(22px,5vmin);line-height:1.12;max-width:42ch;text-wrap:balance}
.opts.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vmin}
.tgrid .opt{font-size:max(15px,3vmin);padding:1.3vmin 1.6vmin}
.pair{display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.pair .print img.flag{width:30vmin}
.pair .print figcaption{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:800;font-size:max(14px,2.6vmin);color:var(--ink)}
.emoji-big{font-size:max(56px,17vmin);line-height:1.15;padding:4vmin 3vmin;text-align:center;min-width:40vmin}
.qtitle.likely{font-size:max(26px,6.6vmin);max-width:22ch}
.ph-q{font-weight:800;font-size:20px;line-height:1.3}
.emoji-q{font-size:54px;text-align:center;line-height:1.2}
/* pause */
.pause-ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;align-content:center;gap:2.4vmin;text-align:center;padding:4vmin;
  background:rgba(29,20,15,.86);color:var(--paper);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pause-ov[hidden]{display:none}
.pause-ov .eyebrow{color:var(--sun)}
.pause-ov .big{font-family:var(--display);font-size:max(56px,17vmin);line-height:.9;color:var(--sun);animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.pause-ov .why{font-size:max(16px,3.2vmin);font-weight:700;max-width:38ch;line-height:1.35}
.pause-ov .cd{font-family:var(--display);font-size:max(96px,34vmin);line-height:.9;color:var(--sun);animation:slam .45s cubic-bezier(.2,1.4,.4,1) both}
.pause-ov .hostbar .btn.sm{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.tv.paused .stage *{animation-play-state:paused!important}
.ph-foot{display:flex;justify-content:center}
.ph-foot:empty{display:none}
.rows .voters,.opt .voters{max-width:22vmin}
/* selfies and quick profiles */
.avatar{position:relative;overflow:hidden}
.avatar .av-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:var(--c)}
.selfie-row{display:flex;align-items:center;gap:14px}
.selfie-row .avatar{font-size:26px}
.selfie-btns{display:flex;gap:8px;flex-wrap:wrap}
.pq{display:flex;flex-direction:column;gap:8px}
.pq+.pq{border-top:2px dashed var(--ink-soft);padding-top:12px;margin-top:6px}
.pq b{font-weight:800;font-size:17px}
.pq .chips button{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
.pq .chips button.on{background:var(--cobalt);color:var(--paper)}
.print.prof{padding:3.4vmin 4vmin;max-width:min(66vmin,100%);gap:1.6vmin;transform:rotate(-1.5deg)}
.prof-q{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:max(14px,2.8vmin);color:var(--ink-soft)}
.prof-a{font-family:var(--display);font-size:max(30px,7.6vmin);line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.prof-a.long{font-size:max(22px,5vmin);line-height:1.05}
/* Quips and the Last Lash */
.quips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3vmin;align-items:stretch}
.quipcard{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:2vmin;box-shadow:0 1vmin 0 var(--ink);padding:2.4vmin 2.6vmin 2.2vmin 8vmin;
  display:flex;flex-direction:column;gap:1.6vmin;min-height:18vmin;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.quipcard:nth-child(2){animation-delay:.3s}
.quipcard>b{position:absolute;left:1.8vmin;top:2vmin;display:grid;place-items:center;width:4.4vmin;height:4.4vmin;border-radius:.8vmin;background:var(--oc);color:var(--paper);font-family:var(--display);font-weight:400;border:2px solid var(--ink);font-size:max(14px,2.6vmin)}
.quipcard p{font-weight:800;font-size:max(18px,4vmin);line-height:1.15;overflow-wrap:anywhere}

.quipcard .by b{font-family:var(--display);font-weight:400}
.quipcard .voters{justify-content:flex-start;max-width:none}
.quipcard.win{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both,win .5s var(--t,1.4s) both}
.lash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vmin}

.lash li>b:first-child{font-family:var(--display);font-weight:400;flex:none;width:1.6em}
.lash li>span:not(.avatar):not(.voters){flex:1;min-width:0;overflow-wrap:anywhere}
.lash li>.num{font-family:var(--display);font-weight:400;flex:none}
.lash li.win{animation:rise .4s both,win .5s 1.6s both}
.meldpairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1vmin 3vmin}

.meldpairs li .avatar{font-size:.8em;border-width:2px;margin-right:-1.4vmin}
.meldpairs li>span:not(.avatar){margin-left:1.8vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meldpairs li b{font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,38vmin),1fr));gap:1.8vmin}

.meldcard.win{background:var(--cobalt);color:var(--paper)}
.meldcard.win .eyebrow{color:var(--sun)}
.mrow{display:flex;align-items:center;gap:1.2vmin;font-weight:800;font-size:max(15px,3vmin);min-width:0}
.mrow .avatar{font-size:.7em;border-width:2px}
.mrow>span:not(.avatar){flex:1;min-width:0;overflow-wrap:anywhere}
.mrow i{font-style:normal;opacity:.6}
.mrow b{font-family:var(--display);font-weight:400;color:var(--sun)}
.delta.sip{background:var(--tomato)}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vmin}
.opts.wrap .opt>span:nth-child(2){white-space:normal;overflow:visible;line-height:1.2;overflow-wrap:anywhere}
.tgrid .speaker .avatar{font-size:max(22px,5vmin);border-width:4px}
.lash.bluff li>span:not(.avatar):not(.voters){text-transform:uppercase;letter-spacing:.02em}
.lash.bluff li>span i{font-style:normal;text-transform:none;font-family:var(--label);letter-spacing:.1em;opacity:.75;margin-left:.6em}
.numans{display:flex;align-items:baseline;gap:2vmin;animation:pop .45s .3s cubic-bezier(.3,1.6,.5,1) both}
.numans b{font-family:var(--display);font-weight:400;font-size:max(34px,8vmin);line-height:1}
.answer.upper span{text-transform:uppercase}
.dare{display:flex;align-items:center;gap:2vmin;background:var(--ink);color:var(--paper);border-radius:2vmin;padding:1.6vmin 2.4vmin;animation:rise .5s 1s both;max-width:100%}
.dare .avatar{font-size:max(16px,3.6vmin);border-color:var(--paper)}
.dare b{display:block;font-family:var(--display);font-weight:400;color:var(--sun);font-size:max(14px,2.6vmin)}
.dare span{font-weight:700;font-size:max(14px,2.6vmin)}
.ph-foot{gap:10px;flex-wrap:wrap}
/* the host's captions */
.caption{pointer-events:none;position:fixed;left:50%;bottom:calc(2.4vmin + 58px);transform:translateX(-50%);z-index:25;width:max-content;max-width:min(86vw,1100px);display:flex;align-items:center;gap:1.4vmin;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:1vmin 2.6vmin 1vmin 1vmin;font-weight:800;font-size:max(15px,2.9vmin);line-height:1.2;box-shadow:0 .8vmin 0 rgba(29,20,15,.3);animation:cap .3s cubic-bezier(.3,1.4,.5,1) both}
.caption[hidden]{display:none}
.caption .mic{flex:none;display:grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:400;font-size:.85em;border:2px solid var(--paper)}
.caption.talking .mic{animation:throb .3s ease-in-out infinite alternate}
@keyframes cap{from{transform:translate(-50%,40%);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unblur{from{filter:blur(28px) saturate(.6)}to{filter:blur(0) saturate(1)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes deal{from{transform:translateY(40%) rotate(8deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes slam{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes throb{to{transform:scale(1.12)}}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes win{to{background:var(--cobalt);color:var(--paper);transform:scale(1.03)}}
@keyframes stamp{from{transform:translate(-50%,-50%) scale(2.4) rotate(-14deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-7deg);opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow-up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>

    H.gid = rid(6); H.ph = "lobby"; H.r = 0; H.R = 0; H.rk = ""; H.cur = null; H.order = []; H.photos = {}; H.guesses = {}; H.rv = null; H.phaseEnds = 0; H.pause = null;
    for (const p of Object.values(H.players)) { p.photos = []; p.songs = []; p.score = 0; p.prev = 0; }
    this.save(); this.render(); this.push(true);
  },
  newRoom() {
    this.audio?.pause();
    room?.drop(Object.keys(this.H.photos));
    store.del("wiw.host");
    this.H = this.fresh(); this.seen.clear();
    this.save(); this.render(); this.push(true);
  },

  tick() {
    const H = this.H, now = Date.now();
    if (H.pause) {
      const p = H.pause;
      if (p.cd) {
        const s = Math.ceil((p.cd - now) / 1000);
        if (s !== this.cdShown) { this.cdShown = s; if (s > 0) SFX.play("count"); this.renderPause(); this.push(true); }
        if (now >= p.cd) { SFX.play("go"); this.unpause(); }
      } else if (p.pid && (H.players[p.pid]?.online || !H.players[p.pid] || now - p.at > 20000)) this.resume();
      return;
    }
    if (H.phaseEnds && now >= H.phaseEnds) {
      // The buzzer only sounds when the clock ran out, not when everyone answered early.
      if (H.ph === "q" && H.phaseEnds === H.qStart + H.qDur) SFX.play("buzz");
      return this.advance();
    }
    if (H.ph === "imp-word") {
      const ps = this.players().filter(p => p.online);
      if (ps.length && ps.every(p => p.sw === H.rk) && (!H.phaseEnds || H.phaseEnds - now > 1500)) { H.phaseEnds = now + 1500; this.push(true); }
    }
    if (H.ph === "imp-talk") {
      const ps = this.players().filter(p => p.online);
      if (ps.length && ps.every(p => p.rd === H.rk) && (!H.phaseEnds || H.phaseEnds - now > 1200)) { H.phaseEnds = now + 1200; this.push(true); }
    }
    if (H.ph === "imp-clue") {
      const sp = H.players[H.cur.order[H.turn]];
      if (!sp || !sp.online) return this.advance();
    }
    if (H.ph === "q") {
      const owner = this.curOwner();
      const eligible = Object.values(H.players).filter(p => p.online && p.pid !== owner);
      if (eligible.length && eligible.every(p => H.guesses[p.pid]) && (!H.phaseEnds || H.phaseEnds - now > 1200)) {
        const early = !H.phaseEnds || H.phaseEnds - now > 6000;
        H.phaseEnds = now + 1200; this.push(true);
        if (early && eligible.length >= 2 && !["song", "tune"].includes(H.cur?.t) && Math.random() < 0.35) this.say("allin");
      }
    }
    if (H.ph === "qw") {
      const ps = this.players().filter(p => p.online), done = ps.every(p => this.writesFor(p.pid).every(i => H.cur.ans[i]?.[p.pid]));
      if (ps.length && done && (!H.phaseEnds || H.phaseEnds - now > 1500)) { H.phaseEnds = now + 1500; this.push(true); }
    }
    if (H.ph === "qv") {
      const vs = this.voters();
      if (vs.length && vs.every(p => H.guesses[p.pid]) && (!H.phaseEnds || H.phaseEnds - now > 1200)) { H.phaseEnds = now + 1200; this.push(true); }
    }
    if (H.ph === "lobby") {
      let pruned = false;
      for (const p of Object.values(H.players)) if (!p.online && now - (p.seen || 0) > 45000) {
        for (const id of p.photos) delete H.photos[id];
        for (const [k, sg] of Object.entries(H.songs)) if (sg.pid === p.pid) delete H.songs[k];
        delete H.players[p.pid]; pruned = true;
      }
      if (pruned) { this.save(); this.render(); }
    }
    this.renderClock();
    if (H.phaseEnds && now - this.lastPush > 1000) this.push(true);
  },

  push(force) {
    if (!room || roomState !== "ok") return;
    const H = this.H, now = Date.now();
    const pres = {
      app: APP, role: "h", code: H.code, gid: H.gid, ph: H.ph, r: H.r, R: H.R, rk: H.rk || null,
      pl: this.players().map(p => [p.pid, p.name, p.color, p.score, p.online ? 1 : 0, p.photos, p.songs || [], p.av || ""]),
      kind: H.cur?.t || null, th: themeOf(H).label,
      imp: this.isImp() && ["intro", ...IMP_PHASES, "q", "rev"].includes(H.ph) ? { cat: H.cur.cat, sp: H.ph === "imp-clue" ? H.cur.order[H.turn] : null, turn: H.turn || 0, n: H.cur.order.length, none: H.impVar === "none" ? 1 : 0 } : null,
      aw: H.ph === "end" ? this.awards().map(([p, title, detail]) => [p.pid, title, detail]) : null,
      vip: H.vip || null, can: this.canStart() ? 1 : 0,
      x: H.ph === "q" && this.curOwner() ? fnv(this.curOwner() + H.rk) : null,
      // Who said it: the answer the room is guessing about, and which one of how many.
      sa: H.cur?.t === "said" && ["q", "rev"].includes(H.ph) && H.cur.ord ? [H.cur.q, H.cur.a, H.cur.mi + 1, H.cur.ord.length] : null,
      rv: ["rev", "lb", "end"].includes(H.ph) ? H.rv : null,
      modes: H.modes,
      qz: this.isQuiz() && (H.ph === "q" || H.ph === "rev") ? { t: H.cur.t, o: H.cur.o || null, k: H.cur.ask || null, q: askOf(H.cur), e: H.cur.t === "emoji" ? H.cur.e : null, u: H.cur.u || null, y: H.cur.y ? 1 : 0,
        ...(H.cur.t === "hot" ? { me: H.cur.me, s: H.cur.pid } : {}) } : null,
      lk: H.cur?.t === "likely" ? H.cur.lk : null,
      // Writing rounds: the prompts while writing, then the answers being voted on. `x` marks whose they are, hashed like `x` above.
      qp: H.ph === "qw" && this.isWrite() ? (H.cur.t === "ttl" ? { ttl: 1 } : H.cur.t === "meld" ? { ps: H.cur.ps.map(m => [m.q, m.by]), meld: 1 } : ["lash", "bluff", "said"].includes(H.cur.t) ? { lash: H.cur.q, bluff: H.cur.t === "bluff" ? 1 : 0, said: H.cur.t === "said" ? 1 : 0 } : { ps: H.cur.ps.map(m => [m.q, m.by]) }) : null,
      qv: H.ph === "qv" && this.isWrite() ? (H.cur.t === "bluff" ? { q: H.cur.q, a: H.cur.opts.map(o => o.t), x: H.cur.opts.map(o => o.by.map(pid => fnv(pid + H.rk))) }
        : H.cur.t === "lash" ? { q: H.cur.q, a: H.cur.ord.map(pid => H.cur.ans[0][pid]), x: H.cur.ord.map(pid => fnv(pid + H.rk)) }
        : (m => ({ q: m.q, a: m.by.map(pid => H.cur.ans[H.cur.mi]?.[pid] || ""), x: m.by.map(pid => fnv(pid + H.rk)) }))(H.cur.ps[H.cur.mi])) : null,
      sp: H.cur?.sp ? 1 : 0, spicy: H.spicy !== "off" ? 1 : 0, drinks: H.drinks ? 1 : 0,
      dare: H.ph === "lb" ? H.dare || null : null,
      pause: H.pause ? { cd: H.pause.cd ? Math.max(1, Math.ceil((H.pause.cd - now) / 1000)) : 0, who: H.pause.pid ? H.players[H.pause.pid]?.name || null : null } : null,
    };
    const body = JSON.stringify(pres);
    if (!force && body === this.lastBody && now - this.lastPush < 1000) return;
    pres.left = H.phaseEnds ? Math.max(0, Math.round((H.phaseEnds - (H.pause ? H.pause.at : now)) / 100) / 10) : null;
    this.lastBody = body; this.lastPush = now;
    room.presence(pres).catch(e => console.warn("presence", e));
  },

  key(e) {
    if (e.key === "Escape" && this.settingsOpen) { e.preventDefault(); return this.openSettings(false); }
    if (e.target.closest?.("input,textarea,button,select")) return;
    const H = this.H, ph = H.ph;
    // Space or P pauses and resumes; the right arrow skips ahead.
    if ((e.key === " " || e.key === "p" || e.key === "P") && this.inGame()) { e.preventDefault(); return H.pause && !H.pause.cd ? this.resume() : this.pause(); }
    if (e.key === "ArrowRight" && ["intro", "q", "rev", "lb", ...IMP_PHASES].includes(ph)) { e.preventDefault(); this.unpause(); this.advance(); }
    if (e.key === "Enter" && ph === "lobby" && !this.settingsOpen && this.canStart()) { e.preventDefault(); this.startGame(); }
  },
  act(a, el) {
    const now = Date.now();
    const twoTap = a === "new-room" || a === "end-game" || a === "exit";
    if (twoTap && !(this.confirm?.a === a && now < this.confirm.until)) {
      this.confirm = { a, until: now + 3000 }; this.renderHostbar(); this.renderModes();
      setTimeout(() => { if (this.confirm?.a === a && Date.now() >= this.confirm.until) { this.confirm = null; this.renderHostbar(); this.renderModes(); } }, 3100);
      return;
    }
    this.confirm = null;
    if (a === "start" && this.canStart()) { this.openSettings(false); this.startGame(); }
    else if (a === "settings") this.openSettings(true);
    else if (a === "settings-done") this.openSettings(false);
    else if (a === "next") { this.unpause(); this.advance(); }
    else if (a === "pause") this.pause();
    else if (a === "resume") this.resume();
    else if (a === "sound-check") { SFX.unlock(); setTimeout(() => { SFX.play("check"); setTimeout(() => this.say("check", true), 700); }, 80); }
    else if (a === "end-game") { this.unpause(); this.go("end"); }
    else if (a === "again") this.playAgain();
    else if (a === "new-room") { this.settingsOpen = false; this.newRoom(); }
    else if (a === "exit") { store.del("wiw.mode"); location.href = "/"; }
    else if (a === "full") { if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); else document.documentElement.requestFullscreen?.().catch(() => {}); }
    else if (a === "add-photo") { this.addFor = el.dataset.pid; fileIn.value = ""; fileIn.click(); }
    else if (a === "mode") this.toggleMode(el.dataset.m);
    else if (a === "tune-mix") this.setTune(el.dataset.q, el.dataset.l);
    else if (a === "face-cat") this.setFaceCat(el.dataset.c);
    else if (a === "sound") { this.needSound = false; this.audio?.play().catch(e => { if (e?.name === "NotAllowedError") { this.needSound = true; this.renderHostbar(); } }); }
    this.renderHostbar();
  },
  async addPhotos(files) {
    const H = this.H, pl = H.players[this.addFor];
    if (!pl || H.ph !== "lobby") return;
    for (const f of files) {
      if (pl.photos.length >= PER_PLAYER) break;
      try {
        const b64 = await compress(f);
        if (!b64) continue;
        const id = "f" + rid(9);
        await postPhoto(id, pl.pid, H.code, b64);
        if (this.H !== H || H.ph !== "lobby" || H.players[pl.pid] !== pl || pl.photos.length >= PER_PLAYER) { room?.drop([id]); break; }
        H.photos[id] = { id, pid: pl.pid, from: "host", src: photoSrc(id) };
        pl.photos.push(id);
        this.save(); this.render(); this.push(true);
      } catch {}
    }
  },

  // ---------- TV rendering ----------
  render() { const tv = $(".tv"); if (tv) tv.dataset.ph = this.H.ph; this.renderStatus(); this.renderHostbar(); this.renderStage(); this.renderClock(); this.renderPause(); this.mood(); },
  renderPause() {
    const H = this.H, p = H.pause, el = $("#pause-ov");
    $(".tv")?.classList.toggle("paused", !!p);
    if (!el) return;
    el.hidden = !p;
    if (!p) return paint(el, "", "");
    const s = p.cd ? Math.max(1, Math.ceil((p.cd - Date.now()) / 1000)) : 0, who = H.players[p.pid];
    paint(el, `${s}|${p.pid}|${who?.online}`, s ? `<p class="eyebrow">Back in</p><p class="cd num">${s}</p>`
      : `<p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><h2 class="big">Paused</h2>
        <p class="why">${who && !who.online ? `${esc(who.name)} dropped out. Waiting a moment for them to come back.` : "Grab a drink. Press space or Resume when everyone's back."}</p>
        <div class="hostbar"><button class="btn primary" data-act="resume">Resume</button><button class="btn sm" data-act="next">Skip ahead</button></div>`);
  },
  renderStatus() {
    const H = this.H, n = this.players().length;
    let extra = "";
    if (roomState === "none") extra = `<span class="pill dark">Server unreachable</span>`;
    else if (roomState === "ok" && !this.connected) extra = `<span class="pill dark">Reconnecting to the server</span>`;
    if (this.clipFailed) extra += `<span class="pill dark">${this.clipFailed === "skip" ? "This song didn't load. Skipping it" : "This song didn't load. Press Next to skip"}</span>`;
    paint($("#tv-status"), `${H.code}|${n}|${roomState}|${this.connected}|${this.clipFailed}`, `${extra}<span class="pill">Room ${esc(H.code)}</span><span class="pill num">${n} ${n === 1 ? "player" : "players"}</span>`);
  },
  renderHostbar() {
    const H = this.H, c = this.confirm?.a;
    const lbl = (a, t) => (c === a ? "Tap again to confirm" : t);
    let html = "";
    if (H.ph === "lobby") {
      const need = H.modes.every(m => CROWD_KINDS.includes(m)) ? "These rounds need at least 3 players" : H.modes.every(m => CROWD_KINDS.includes(m) || PAIR_KINDS.includes(m)) ? "These rounds need at least 2 players" : photosOnly(H) ? "Start needs 2 players and 2 photos" : ownerOnly(H) ? "Start needs 2 players and 2 photos or songs" : "Start needs at least 1 player";
      const why = this.starting ? `<span class="why">Shuffling the rounds…</span>` : this.err ? `<span class="why">${esc(this.err)}</span>` : this.canStart() ? "" : `<span class="why">${need}</span>`;
      // Until someone clicks, the browser keeps the TV silent, so the first button offered is the one that turns sound on.
      const snd = H.snd === "off" ? "" : SFX.ready() ? `<button class="btn sm" data-act="sound-check">Sound check</button>` : `<button class="btn blue" data-act="sound-check">Turn on sound</button>`;
      html = `<button class="btn primary" data-act="start" ${this.canStart() ? "" : "disabled"}>Start game</button>${why}${snd}`;
    } else if (H.ph === "end") {
      html = `<button class="btn primary" data-act="again">Play again</button><button class="btn sm" data-act="new-room">${lbl("new-room", "New room")}</button>`;
    } else {
      html = `${this.needSound ? `<button class="btn primary" data-act="sound">Turn on sound</button>` : ""}<button class="btn sm" data-act="pause">Pause</button><button class="btn sm" data-act="next">Next</button><button class="btn sm" data-act="end-game">${lbl("end-game", "End game")}</button>`;
    }
    html += `<button class="btn sm" data-act="full">Full screen</button>${H.ph === "lobby" ? "" : `<button class="btn sm" data-act="exit">${lbl("exit", "Exit TV mode")}</button>`}`;
    paint($("#hostbar"), `${H.ph}|${this.canStart()}|${c}|${this.starting}|${this.err}|${H.modes.join()}|${this.needSound}|${SFX.ready()}|${H.snd}`, html);
  },
  renderStage() {
    const H = this.H, stage = $("#stage");
    if (H.ph === "lobby") {
      // The lobby is what the room looks at while people arrive: how to join, who's in, and one line about tonight.
      // Everything you can change lives behind Rounds & settings.
      paint(stage, "lobby|" + H.code, `<section class="lobby"><div id="lobby-left"></div><div class="roster"><div id="tonight" class="tonight"></div><div id="roster" class="roster-body"></div></div>
        <div class="settings" id="settings" ${this.settingsOpen ? "" : "hidden"}><div class="settings-card" role="dialog" aria-modal="true" aria-label="Rounds and settings">
          <div class="settings-head"><h2>Rounds &amp; settings</h2><button class="btn primary sm" data-act="settings-done">Done</button></div>
          <div id="modes" class="modes"></div></div></div></section>`);
      const url = JOIN_BASE + "#" + H.code;
      const brings = [H.modes.includes("photo") && "photos", H.modes.includes("song") && "songs", H.modes.includes("prof") && "quick answers"].filter(Boolean).join(" and ");
      const lede = photosOnly(H) ? "Send in photos from your phone. One pops up on the TV. Guess whose it is."
        : brings ? `Scan to join, then add your ${brings} on your phone.` : "One TV, everyone's phones. Scan to join.";
      paint($("#lobby-left"), H.code + "|" + url + "|" + roomState + "|" + H.modes.join(), `
        <h1 class="wordmark fafo" aria-label="fafo"><span>fa</span><span class="two">fo</span></h1>
        <p class="lede">${lede}</p>
        <div class="joincard">
          <div class="qr">${qrSvg(url)}</div>
          <div><p class="eyebrow">Scan to join</p><p class="code">${esc(H.code)}</p>
          <p class="small">${JOIN_HOSTED ? `No camera? Go to <b>${esc(JOIN_HOST)}</b> and type the code.` : JOIN_LAN ? `Same Wi-Fi as this laptop. No camera? Go to <b>${esc(JOIN_HOST)}</b> and type the code.`
            : "This laptop isn't on Wi-Fi, so phones can't reach it. Connect it and restart the game server."}</p></div>
        </div>`);
      this.renderModes();
      return this.renderRoster();
    }
    this.settingsOpen = false;
    if (H.ph === "intro") {
      const final = H.R > 1 && H.r === H.R, only = photosOnly(H), kind = H.cur?.t;
      const big = only ? (final ? "Final photo" : "Photo " + H.r) : final ? "Final round" : KIND_BIG[kind] || "Round " + H.r;
      return paint(stage, "intro|" + H.rk, `<section class="intro"><p class="eyebrow">Phones out. ${unitOf(H)} ${H.r} of ${H.R}${only ? "" : " · " + (MODE_LABEL[kind] || "") + this.musicTag(H.cur)}</p>
        <h2 class="big">${big}</h2>${final ? `<p class="dbl">Double points</p>` : ""}</section>`);
    }
    if (IMP_PHASES.includes(H.ph) || (H.ph === "q" && this.isImp())) return this.renderImp(stage);
    if (H.ph === "qw") return this.renderWrite(stage);
    if (H.ph === "qv") return this.renderVote(stage);
    if (H.ph === "q" && H.cur?.t === "likely") return this.renderLikely(stage);
    if (H.ph === "q") {
      if (this.isQuiz()) return this.renderQuiz(stage);
      const final = H.R > 1 && H.r === H.R;
      const said = H.cur.t === "said" ? ` · Who said it · Answer ${H.cur.mi + 1} of ${H.cur.ord.length}` : "";
      paint(stage, "q|" + H.rk, `<section class="qgrid">
        <div class="qphoto">${this.ownerMedia(H.cur)}</div>
        <div class="qside">
          <p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}${said}${final ? " · Double points" : ""}</p>
          <h2 class="qtitle">${KIND_ASK[H.cur.t]}</h2>
          <div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>
          <p class="eyebrow" id="lockcount"></p>
          <ul class="locks" id="locks"></ul>
        </div></section>`);
      this.renderLocks(this.curOwner());
      return;
    }
    if (H.ph === "rev") return paint(stage, "rev|" + H.rk + "|" + (DATA.shapes ? 1 : 0), this.revealHtml());
    if (H.ph === "lb") return paint(stage, "lb|" + H.rk, this.boardHtml(`Scores after ${unitOf(H).toLowerCase()} ${H.r}`));
    if (H.ph === "end") return paint(stage, "end|" + H.gid + "|" + H.r, this.endHtml());
  },
  renderRoster() {
    const H = this.H, el = $("#roster");
    if (!el) return;
    const ps = this.players(), total = this.photoCount();
    const photos = this.photosOn(), songs = H.modes.includes("song");
    const sig = ps.map(p => [p.pid, p.name, p.color, p.photos.length, (p.songs || []).length, p.online ? 1 : 0, H.vip === p.pid ? 1 : 0, p.sending || 0, p.av, Object.keys(p.pf || {}).length].join(",")).join(";") + "|" + total + "|" + H.modes.join();
    const cards = ps.map(p => {
      const bits = photos ? [p.photos.length === 1 ? "1 photo" : p.photos.length + " photos"] : [];
      if (photos && p.sending) bits.push(`sending ${p.sending} more`);
      if (songs) bits.push((p.songs || []).length === 1 ? "1 song" : (p.songs || []).length + " songs");
      if (H.modes.includes("prof")) { const n = Object.keys(p.pf || {}).length; bits.push(n === 1 ? "1 answer" : n + " answers"); }
      if (H.vip === p.pid) bits.push("starts the game");
      if (!p.online) bits.push("offline");
      if (!bits.length) bits.push("ready");
      const fresh = !this.seen.has(p.pid); this.seen.add(p.pid);
      return `<li class="pcard ${p.online ? "" : "off"} ${fresh ? "pop" : ""}">${face(p)}
        <div class="pc-body"><span class="nm">${esc(p.name)}</span><span class="meta">${bits.join(" · ")}</span></div>
        ${photos && p.photos.length < PER_PLAYER ? `<button class="addph" data-act="add-photo" data-pid="${p.pid}" title="Add a photo for ${esc(p.name)} from this computer">+ Photo</button>` : ""}</li>`;
    }).join("");
    const frames = Array.from({ length: total }, () => `<span class="frame on"></span>`).join("");
    const mins = Math.max(1, Math.round(total * 28 / 60));
    const cap = total ? `${total} ${total === 1 ? "photo" : "photos"} in. Every one gets played, about ${mins} min.` : `No photos yet. Everyone can add up to ${PER_PLAYER}, and every photo gets played.`;
    paint(el, sig, `
      <div class="roster-head"><h2>Players</h2><span class="count num">${ps.length}/${MAX_PLAYERS}</span></div>
      ${ps.length ? `<ul class="pgrid">${cards}</ul>` : `<div class="empty">Nobody yet. Scan the code with a phone camera to join.</div>`}
      ${photos ? `${total ? `<div class="film" aria-hidden="true">${frames}</div>` : ""}<p class="filmcap num">${cap}</p>` : ""}`);
  },
  // Who picked this answer: their faces, or just a count when the room plays with anonymous votes.
  votersHtml(ids, i) {
    const P = this.H.players, who = ids.filter(id => P[id]), n = who.length, at = 0.4 + i * 0.25;
    if (!n) return "<span></span>";
    if (this.H.anon) return `<span class="votes num" style="animation-delay:${at.toFixed(2)}s">${n} ${n === 1 ? "vote" : "votes"}</span>`;
    return `<span class="voters" aria-label="${esc(who.map(id => P[id].name).join(", "))}">${who.map((id, k) => `<span style="animation-delay:${(at + k * 0.08).toFixed(2)}s" title="${esc(P[id].name)}">${face(P[id])}</span>`).join("")}</span>`;
  },
  // Everyone who scored this round and how much. With anonymous votes only the count shows.
  scorersHtml(rv, count, none) {

  numRevealHtml() {

        <b class="num">${rv.d[r.id] ? "+" + fmt(rv.d[r.id]) : "off by " + esc(cur.y ? String(r.off) : fmt(r.off))}</b></li>`).join("")}</ol>

  bluffRevealHtml() {

  clockHtml() { return `<div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>`; },

  lashRevealHtml() {

  renderLikely(stage) {

    paint(stage, "lq|" + H.rk, `<section class="imp"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Most likely to${final ? " · Double points" : ""}</p>
      <h2 class="qtitle likely">Who's most likely to ${esc(H.cur.lk)}?</h2>

      <div class="qfoot"><div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>
        <div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div></div></section>`);

  },
  likelyRevealHtml() {
    const H = this.H, rv = H.rv || { g: {}, d: {} }, P = H.players, tops = (rv.top || []).filter(id => P[id]);
    const votes = this.votesBy(rv.g);
    const rows = Object.keys(votes).filter(id => P[id]).sort((a, b) => votes[b].length - votes[a].length);
    const t = 1.4 + rows.length * 0.25, sided = Object.keys(rv.d || {}).length, lead = tops.length === 1 ? P[tops[0]] : null;
    const rowHtml = rows.map((id, i) => `<li class="${tops.includes(id) ? "win" : ""}">${face(P[id])}<span class="nm">${esc(P[id].name)}</span>${this.votersHtml(votes[id], i)}</li>`).join("");
    return `<section class="rgrid impr" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto bigav"><p class="eyebrow">Most likely to ${esc(rv.lk || H.cur.lk)}</p>${lead ? face(lead) : ""}${rows.length ? `<div class="stamp low">${lead ? esc(lead.name) + "!" : tops.length ? "It's a tie!" : "Split vote!"}</div>` : ""}</div>
      <div class="rside"><p class="eyebrow">${rows.length ? "Votes" : "Nobody voted"}${rv.m > 1 ? " · Double points" : ""}</p><ul class="rows">${rowHtml}</ul>
        <div class="deltas">${this.scorersHtml(rv, sided ? `${sided} ${sided === 1 ? "person" : "people"} sided with the room` : "", "Nobody scored this round")}${this.sipHtml()}</div></div></section>`;
  },
  renderImp(stage) {
    const H = this.H, cur = H.cur, P = H.players, final = H.R > 1 && H.r === H.R;
    const head = `<p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Imposter · ${esc(cur.cat)}${final ? " · Double points" : ""}</p>`;
    const progress = (label, n, total) => {
      paint($("#lockcount"), `${label}${n}/${total}`, `${label} <span class="num">${n} of ${total}</span>`);
      paint($("#locks"), `${label}${n}/${total}`, Array.from({ length: total }, (_, i) => `<li class="dot ${i < n ? "in" : ""}"></li>`).join(""));
    };
    const meter = `<div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div>`;
    const online = this.players().filter(p => p.online);
    if (H.ph === "imp-word") {
      paint(stage, "impw|" + H.rk, `<section class="imp">${head}<h2 class="qtitle">Check your word</h2>
        <p class="lede">Everyone has the same secret word on their phone, except one of you. ${H.impVar === "none" ? "The imposter has no word, and knows it." : "The imposter has a different word, and doesn't know it."} Keep your screen to yourself. Clues start once everyone has looked.</p>${meter}</section>`);

    }
    if (H.ph === "imp-clue") {
