<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fafo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFC53D'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-weight='900' font-size='20' text-anchor='middle' fill='%231D140F'%3EF%3C/text%3E%3C/svg%3E">
<!-- Fonts are served by the laptop so the game looks right even on a Wi-Fi with no internet. -->
<link rel="stylesheet" href="/fonts/bungee/index.css">
<link rel="stylesheet" href="/fonts/barlow/500.css">
<link rel="stylesheet" href="/fonts/barlow/600.css">
<link rel="stylesheet" href="/fonts/barlow/700.css">
<link rel="stylesheet" href="/fonts/barlow/800.css">
<link rel="stylesheet" href="/fonts/barlow-condensed/600.css">
<link rel="stylesheet" href="/fonts/barlow-condensed/700.css">
<style>
/* Layout: game-show set on a halftone marigold ground. TV = full-bleed 16:9 stage, phone = one-column controller. */
:root{
  --sun:#FFC53D; --sun-deep:#EBA61A; --ink:#1D140F; --ink-soft:#5A4630; --paper:#FFFBF0; --photo-bg:#2A211B;
  --tomato:#D93A26; --cobalt:#2342C6; --mint:#11704F;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--sun);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;
  background-image:radial-gradient(circle,var(--sun-deep) 1.1px,transparent 1.7px);background-size:16px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{height:100%}
h1,h2,h3,p,ul,ol,figure{margin:0}
h1,h2{text-wrap:balance}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--cobalt);outline-offset:3px}
.eyebrow{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;padding:.85em 1.3em;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--tomato);color:var(--paper)}
.btn.blue{background:var(--cobalt);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:.8rem;padding:.55em .95em;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;font-family:var(--body);font-weight:700;padding:.4em .6em}

/* avatars + prints */
.avatar{display:inline-grid;place-items:center;width:2.4em;height:2.4em;border-radius:50%;background:var(--c);color:#FFFBF0;
  font-family:var(--display);border:3px solid var(--ink);flex:none;line-height:1}
.print{display:inline-flex;flex-direction:column;background:var(--paper);padding:1.6vmin 1.6vmin 0;border:3px solid var(--ink);
  box-shadow:1vmin 1.2vmin 0 var(--ink);transform:rotate(-2deg);max-width:100%}
.print img{display:block;max-width:100%;max-height:60vmin;width:auto;height:auto;background:var(--photo-bg);object-fit:contain}
.print figcaption{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:2.2vmin;padding:1.4vmin 0 1.6vmin;color:var(--ink-soft)}

/* landing */
.landing{min-height:100%;max-width:1040px;margin:0 auto;padding-block:clamp(28px,7vh,80px);display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.wordmark{font-family:var(--display);font-size:clamp(64px,12vw,148px);line-height:.86;letter-spacing:-.01em}
.wordmark span{display:block}
.wordmark .two{color:var(--paper);-webkit-text-stroke:.03em var(--ink);paint-order:stroke fill;text-shadow:.045em .055em 0 var(--ink);margin-left:.35em}
.wordmark.fafo{font-size:clamp(84px,17vw,200px);line-height:1}
.wordmark.fafo span{display:inline}
.wordmark.fafo .two{margin-left:.03em}
.lobby .wordmark.fafo{font-size:17vmin}
.lede{font-size:clamp(18px,2.1vw,22px);line-height:1.45;max-width:38ch;margin-top:24px;font-weight:600}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:18px}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);width:1.8em;height:1.8em;display:grid;place-items:center;background:var(--sun);border:2px solid var(--ink);border-radius:50%}
.warn{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;line-height:1.4}
@media (max-width:760px){.landing{grid-template-columns:minmax(0,1fr)}}

/* ---------- TV ---------- */
.tv{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2vmin;padding-block:2.4vmin;max-width:2000px;margin:0 auto}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:max(18px,3.4vmin)}
.tv[data-ph=lobby] .tv-top .logo{visibility:hidden}
.tv-status{display:flex;gap:1.2vmin;align-items:center;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:max(13px,2vmin)}
.pill{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:.35em .9em}
.pill.dark{background:var(--ink);color:var(--paper)}
.stage{min-height:0;position:relative}
.hostbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:40px}
.hostbar .why{font-weight:700;color:var(--ink-soft)}

.lobby{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vmin;align-items:center}
.lobby .wordmark{font-size:12vmin}
.lobby .lede{font-size:max(15px,2.5vmin);margin-top:2.4vmin;max-width:34ch}
.joincard{margin-top:4vmin;display:flex;gap:3vmin;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:2vmin;
  box-shadow:0 1vmin 0 var(--ink);padding:2.4vmin;width:fit-content;max-width:100%;transform:rotate(-1.2deg)}
.qr svg{width:max(140px,27vmin);height:max(140px,27vmin);display:block}
.code{font-family:var(--display);font-size:max(36px,9vmin);letter-spacing:.06em;line-height:1}
.joincard .small{font-size:max(13px,2vmin);color:var(--ink-soft);max-width:22ch;line-height:1.35;margin-top:1vmin}
.roster{align-self:stretch;display:flex;flex-direction:column;gap:2vmin;min-height:0;justify-content:center}
.roster-head{display:flex;justify-content:space-between;align-items:baseline}
.roster-head h2{font-family:var(--display);font-size:max(22px,4.4vmin)}
.roster-head .count{font-family:var(--display);font-size:max(16px,3vmin)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vmin}
.pcard{display:flex;align-items:center;gap:1.4vmin;background:var(--paper);border:3px solid var(--ink);border-radius:1.6vmin;padding:1.1vmin 1.4vmin;font-size:max(14px,2.5vmin);min-width:0}
.pcard.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.pcard.off{opacity:.5}
.pc-body{display:flex;flex-direction:column;min-width:0;flex:1}
.pc-body .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-body .meta{font-family:var(--label);font-weight:600;font-size:.78em;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addph{flex:none;font-family:var(--label);font-weight:700;font-size:.72em;text-transform:uppercase;letter-spacing:.06em;background:transparent;border:2px dashed var(--ink-soft);border-radius:8px;padding:.3em .6em;cursor:pointer;color:var(--ink-soft)}
.empty{border:3px dashed var(--ink-soft);border-radius:2vmin;padding:4vmin;text-align:center;font-size:max(15px,2.6vmin);font-weight:700;color:var(--ink-soft)}
.film{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(14px,3.4vmin),1fr));gap:.6vmin;background:var(--ink);padding:1.1vmin .9vmin;border-radius:.8vmin;position:relative}
.film::before,.film::after{content:"";position:absolute;left:.9vmin;right:.9vmin;height:.5vmin;background:repeating-linear-gradient(90deg,var(--paper) 0 1vmin,transparent 1vmin 2.2vmin);opacity:.7}
.film::before{top:.3vmin}.film::after{bottom:.3vmin}
.frame{aspect-ratio:4/3;border-radius:.3vmin;background:#3A2E26;border:1px solid #4D3E33}
.frame.on{background:var(--sun);border-color:var(--sun)}
.filmcap{font-size:max(13px,2.1vmin);font-weight:700}
.points-key{font-size:max(12px,1.9vmin);color:var(--ink-soft);line-height:1.4}

.qgrid,.rgrid{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:5vmin;align-items:center}
.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.qphoto{display:grid;place-items:center;min-height:0;position:relative;height:100%}
.qphoto .print{animation:deal .6s cubic-bezier(.2,1.2,.4,1) both}
.rgrid .print img{max-height:52vmin}
.qside,.rside{display:flex;flex-direction:column;gap:2.2vmin;min-width:0}
.qtitle{font-family:var(--display);font-size:max(26px,6.4vmin);line-height:.98}
.clock{position:relative;width:max(90px,17vmin);height:max(90px,17vmin)}
.clock svg{width:100%;height:100%;display:block}
.clock .bg{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.clock .ring{fill:none;stroke:var(--tomato);stroke-width:9;stroke-dasharray:100;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.clock span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:max(30px,6.4vmin)}
.clock.hurry span{color:var(--tomato);animation:throb .5s ease-in-out infinite alternate}
.locks{display:flex;flex-wrap:wrap;gap:1.1vmin}
.lock{display:flex;align-items:center;gap:.9vmin;padding:.6vmin 1.3vmin .6vmin .6vmin;border:2px dashed var(--ink-soft);border-radius:999px;font-weight:800;font-size:max(13px,2.2vmin);color:var(--ink-soft)}
.lock .avatar{font-size:.8em;border-width:2px}
.lock.in{border-style:solid;border-color:var(--ink);background:var(--paper);color:var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.lock.owner{opacity:.55}
.locks .dot{width:max(16px,3vmin);height:max(16px,3vmin);border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.locks .dot.in{background:var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.votes{font-family:var(--display);font-weight:400;font-size:.85em;white-space:nowrap;animation:drop .35s cubic-bezier(.3,1.5,.5,1) both}

.intro{height:100%;display:grid;place-items:center;text-align:center;align-content:center;gap:2vmin}
.intro .big{font-family:var(--display);font-size:max(48px,16vmin);line-height:.9;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.dbl{font-family:var(--display);font-size:max(20px,4.4vmin);background:var(--tomato);color:var(--paper);padding:.3em .8em;border:3px solid var(--ink);border-radius:1vmin;transform:rotate(-3deg);box-shadow:0 .7vmin 0 var(--ink)}

.rows{display:flex;flex-direction:column;gap:1.3vmin}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.4vmin;background:var(--paper);border:3px solid var(--ink);border-radius:1.4vmin;padding:1vmin 1.4vmin;font-size:max(15px,2.8vmin);font-weight:800}
.rows li.win{animation:win .5s var(--t,2.2s) both}
.rows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voters{display:flex;gap:.5vmin;flex-wrap:wrap;justify-content:flex-end}
.voters>span{display:inline-flex;animation:drop .35s cubic-bezier(.3,1.5,.5,1) both}
.voters .avatar{font-size:.62em;border-width:2px}
.stamp{position:absolute;left:50%;top:50%;font-family:var(--display);font-size:max(26px,7.4vmin);color:var(--paper);background:var(--cobalt);padding:.15em .5em;border:4px solid var(--ink);
  border-radius:1vmin;white-space:nowrap;box-shadow:0 1vmin 0 var(--ink);animation:stamp .45s var(--t,2.2s) cubic-bezier(.2,1.4,.4,1) both;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.deltas{display:flex;flex-wrap:wrap;gap:1vmin;animation:rise .4s var(--t2,3s) both}
.delta{display:flex;align-items:center;gap:.8vmin;background:var(--ink);color:var(--paper);border-radius:999px;padding:.5vmin 1.4vmin .5vmin .5vmin;font-weight:800;font-size:max(13px,2.2vmin)}
.delta .avatar{font-size:.75em;border-width:2px;border-color:var(--paper)}
.delta b{font-family:var(--display);font-weight:400;color:var(--sun)}
.nobody{font-size:max(15px,2.8vmin);font-weight:800}

.board{height:100%;display:flex;flex-direction:column;justify-content:center;gap:3vmin;max-width:1300px;margin:0 auto;width:100%}
.lb{display:flex;flex-direction:column;gap:1.3vmin}
.lb li{display:grid;grid-template-columns:5vmin auto minmax(0,1fr) auto;align-items:center;gap:1.6vmin;font-size:max(15px,2.9vmin);font-weight:800;animation:rise .4s both}
.lb .rank{font-family:var(--display);text-align:right}
.bar{height:4.6vmin;min-width:0;display:flex;align-items:center}
.bar i{display:block;height:100%;width:var(--w);min-width:1.2vmin;background:var(--c);border:3px solid var(--ink);border-radius:1vmin;animation:grow .8s .2s cubic-bezier(.2,1,.3,1) both;transform-origin:left}
.bar span{margin-left:1.2vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .score{font-family:var(--display);font-weight:400}
.lb .up{font-family:var(--label);color:var(--mint);font-size:.8em;margin-left:.6vmin}

.end{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center}
.end .qtitle{font-size:max(30px,8vmin)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,22vmin));align-items:end;gap:2vmin}
.step{display:flex;flex-direction:column;align-items:center;gap:1.2vmin;min-width:0}
.step .avatar{font-size:max(16px,3.4vmin)}
.step .nm{font-weight:800;font-size:max(14px,2.8vmin);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:1.2vmin 1.2vmin 0 0;display:grid;place-items:center;font-family:var(--display);font-size:max(18px,5vmin);box-shadow:0 1vmin 0 var(--ink);animation:grow-up .7s cubic-bezier(.2,1.2,.4,1) both;transform-origin:bottom}
.block small{display:block;font-size:.42em;font-family:var(--body);font-weight:800}
.p1 .block{height:24vmin;background:var(--sun)}.p2 .block{height:16vmin;animation-delay:.25s}.p3 .block{height:11vmin;animation-delay:.4s}
.rest{display:flex;flex-wrap:wrap;gap:1vmin 2.4vmin;justify-content:center;font-weight:700;font-size:max(13px,2.3vmin)}

@media (max-width:760px){
  .lobby,.qgrid,.rgrid{grid-template-columns:minmax(0,1fr);height:auto;gap:24px}
  .tv{height:auto;min-height:100%}
}

/* ---------- phone ---------- */
.phone{max-width:520px;margin:0 auto;min-height:100%;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.ph-top{display:flex;align-items:center;gap:8px;min-height:44px}
.ph-top .logo{font-size:17px;white-space:nowrap}
.ph-top .room{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;margin-left:auto;white-space:nowrap}
.ph-top .btn.ghost{font-size:14px;padding:.3em .4em}
.ph-top .avatar{font-size:13px;border-width:2px}
.ph-main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.center{text-align:center;align-items:center}
.ph-h{font-family:var(--display);font-size:26px;line-height:1.05}
.ph-big{font-family:var(--display);font-size:40px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.field input{font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
.field input.code-in{font-family:var(--display);letter-spacing:.15em;text-transform:uppercase}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--photo-bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .st{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .st i{position:absolute;left:0;top:0;bottom:0;background:var(--cobalt);width:var(--p,0%);transition:width .2s}
.thumb .st span{position:relative}
.thumb.done .st{background:var(--mint)}
.thumb.bad .st{background:var(--tomato)}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1}
.addtile{aspect-ratio:1;border:3px dashed var(--ink);border-radius:10px;background:transparent;display:grid;place-items:center;font-family:var(--display);font-size:15px;cursor:pointer;text-align:center;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px;background:#fff;max-width:100%}
.chip .avatar{font-size:11px;border-width:2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:19px;cursor:pointer;text-align:left;min-width:0}
.choice span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice .avatar{font-size:13px}
.tbar{height:12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--tomato);width:100%;transition:width .25s linear}
.result{padding:28px 18px}
.result.good{background:var(--cobalt);color:var(--paper)}
.result.bad{background:var(--tomato);color:var(--paper)}
.result.good .eyebrow,.result.bad .eyebrow{color:var(--paper);opacity:.8}
.hostlist{display:flex;flex-direction:column;gap:10px}

/* round picker + flag and map rounds */
.modes{display:flex;flex-direction:column;gap:1vmin}
.mode-row{display:flex;flex-wrap:wrap;gap:1vmin}
.mode{font-family:var(--display);font-size:max(13px,2.1vmin);padding:.5em .9em;border:3px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.mode.on{background:var(--ink);color:var(--sun)}
.print img.flag{width:62vmin;max-width:100%;height:auto;max-height:none;aspect-ratio:4/3;object-fit:cover;background:var(--paper)}
.print .shape{display:block;width:62vmin;max-width:100%;height:auto;aspect-ratio:4/3}
.print .shape path{fill:var(--ink)}
.print .loading{display:grid;place-items:center;width:min(64vmin,100%);aspect-ratio:4/3;font-weight:800;color:var(--ink-soft)}
.rgrid .print img.flag,.rgrid .print .shape,.rgrid .print .loading{width:48vmin}

// Downscale a picked photo to a TV-sized JPEG before it goes over the Wi-Fi.
async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1280, q = 0.82, out = "";
    for (let tries = 0; tries < 5; tries++) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      out = c.toDataURL("image/jpeg", q).split(",")[1] || "";
      if (out.length < 420000) break;
      max = Math.round(max * 0.84); q = Math.max(0.6, q - 0.06);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

// Send a compressed photo to the laptop. The server keeps it in memory and serves it at /photos/<id>.
function postPhoto(id, pid, code, b64, onProg) {
  return new Promise((res, rej) => {
    const bin = atob(b64), buf = new Uint8Array(bin.length);

    x.setRequestHeader("Content-Type", "image/jpeg");
    x.setRequestHeader("X-Pid", pid);

  renderRoster() {

    const sig = ps.map(p => [p.pid, p.name, p.color, p.photos.length, (p.songs || []).length, p.online ? 1 : 0, H.vip === p.pid ? 1 : 0, p.sending || 0].join(",")).join(";") + "|" + total + "|" + H.modes.join();
    const cards = ps.map(p => {
      const bits = photos ? [p.photos.length === 1 ? "1 photo" : p.photos.length + " photos"] : [];
      if (photos && p.sending) bits.push(`sending ${p.sending} more`);
      if (songs) bits.push((p.songs || []).length === 1 ? "1 song" : (p.songs || []).length + " songs");
      if (H.vip === p.pid) bits.push("starts the game");

  revealHtml() {
    if (this.isImp()) return this.impRevealHtml();
    if (this.isQuiz()) return this.quizRevealHtml();

    const P = H.players, owner = P[rv.o];
    const votes = {};
    for (const [voter, pick] of Object.entries(rv.g)) (votes[pick] ||= []).push(voter);
    const ids = new Set(Object.keys(votes)); if (rv.o) ids.add(rv.o);
    const rows = [...ids].filter(id => P[id]).sort((a, b) => (votes[b]?.length || 0) - (votes[a]?.length || 0));
    const nv = Object.keys(rv.g).length;
    const t = 1.2 + nv * 0.18;
    const rowHtml = rows.map((id, i) => {
      const n = (votes[id] || []).length;
      const v = n ? `<span class="votes num" style="animation-delay:${(0.4 + i * 0.25).toFixed(2)}s">${n} ${n === 1 ? "vote" : "votes"}</span>` : "";
      return `<li class="${id === rv.o ? "win" : ""}">${avatar(P[id].name, P[id].color)}<span class="nm">${esc(P[id].name)}</span>${v || "<span></span>"}</li>`;
    }).join("");
    // Say how many got it right, not who. The owner is already revealed, so their bonus can show.
    const right = votes[rv.o]?.length || 0;
    const deltas = `<span class="delta">${right ? `${right} ${right === 1 ? "person" : "people"} got it right` : "Nobody got it right"}</span>`
      + (owner && rv.d[rv.o] ? `<span class="delta">${avatar(owner.name, owner.color)}${esc(owner.name)} fooled ${nv - right} <b class="num">+${fmt(rv.d[rv.o])}</b></span>` : "");
    return `<section class="rgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto">${this.ownerMedia(H.cur, true)}
        ${owner ? `<div class="stamp ${H.cur?.t === "song" ? "low" : ""}">${H.cur?.t === "song" ? `${esc(owner.name)}'s pick!` : `It's ${esc(owner.name)}!`}</div>` : ""}</div>
      <div class="rside">
        <p class="eyebrow">Votes${rv.m > 1 ? " · Double points" : ""}</p>
        ${nv ? `<ul class="rows">${rowHtml}</ul>` : `<p class="nobody">Nobody locked in a guess.</p><ul class="rows">${rowHtml}</ul>`}
        <div class="deltas">${deltas || `<span class="delta">No points this photo</span>`}</div>
      </div></section>`;
  },
  boardHtml(title) {
    const ps = this.players().slice().sort((a, b) => b.score - a.score);
    const top = Math.max(1, ...ps.map(p => p.score));
    const rows = ps.map((p, i) => {
      const rank = 1 + ps.filter(q => q.score > p.score).length;
      const up = p.score - (p.prev ?? p.score);
      return `<li style="animation-delay:${(i * 0.06).toFixed(2)}s"><span class="rank num">${rank}</span>${avatar(p.name, p.color)}
        <span class="bar" style="--c:${color(p.color)};--w:${Math.max(2, p.score / top * 100).toFixed(1)}%"><i></i><span>${esc(p.name)}</span></span>
        <span><span class="score num">${fmt(p.score)}</span>${up > 0 ? `<span class="up num">+${fmt(up)}</span>` : ""}</span></li>`;
    }).join("");
    return `<section class="board"><h2 class="qtitle">${esc(title)}</h2><ol class="lb">${rows}</ol></section>`;
  },
  endHtml() {
    const ps = this.players().slice().sort((a, b) => b.score - a.score);
    if (!ps.length) return `<section class="end"><h2 class="qtitle">Game over</h2></section>`;
    const best = ps[0].score, winners = ps.filter(p => p.score === best);
    const title = winners.length > 1 ? "It's a tie!" : `${esc(winners[0].name)} wins!`;
    const slot = (p, cls, place) => p ? `<div class="step ${cls}">${avatar(p.name, p.color)}<span class="nm">${esc(p.name)}</span><div class="block">${place}<small class="num">${fmt(p.score)}</small></div></div>` : `<div class="step ${cls}"></div>`;
    const rest = ps.slice(3).map((p, i) => `<li>${ordinal(i + 4)} ${esc(p.name)} · <span class="num">${fmt(p.score)}</span></li>`).join("");
    return `<section class="end"><p class="eyebrow">Final scores</p><h2 class="qtitle">${title}</h2>
      <div class="podium">${slot(ps[1], "p2", "2nd")}${slot(ps[0], "p1", "1st")}${slot(ps[2], "p3", "3rd")}</div>
      ${rest ? `<ol class="rest">${rest}</ol>` : ""}

  impRevealHtml() {

    const spotted = Object.entries(rv.g || {}).filter(([pid, pick]) => pid !== rv.o && pick === rv.o).length;
    const rowHtml = rows.map((id, i) => {
      const n = votes[id] || 0;
      return `<li class="${id === rv.o ? "win" : ""}">${avatar(P[id].name, P[id].color)}<span class="nm">${esc(P[id].name)}</span>${n ? `<span class="votes num" style="animation-delay:${(0.4 + i * 0.25).toFixed(2)}s">${n} ${n === 1 ? "vote" : "votes"}</span>` : "<span></span>"}</li>`;
    }).join("");
    const result = rv.caught ? `<span class="delta">Caught! ${spotted} ${spotted === 1 ? "person" : "people"} spotted the imposter</span>`
      : imp ? `<span class="delta">${avatar(imp.name, imp.color)}${esc(imp.name)} got away <b class="num">+${fmt(rv.d?.[rv.o] || 0)}</b></span>` : "";
    return `<section class="rgrid impr" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto bigav"><p class="eyebrow">The imposter was</p>${imp ? avatar(imp.name, imp.color) : ""}${imp ? `<div class="stamp low">${esc(imp.name)}!</div>` : ""}</div>
      <div class="rside">
        <p class="eyebrow">${nv ? "Votes" : "Nobody voted"}${rv.m > 1 ? " · Double points" : ""}</p>
        <ul class="rows">${rowHtml}</ul>
        <p class="words"><span>Everyone: <b>${esc(rv.w)}</b></span><span>${esc(imp?.name || "Imposter")}: <b>${rv.x ? esc(rv.x) : "no word"}</b></span></p>
        <div class="deltas">${result}</div>
        <p class="credit">${P[H.vip] ? `${esc(P[H.vip].name)} starts the next round from their phone, or press Next here.` : "Press Next to carry on."}</p>
      </div></section>`;
  },
  renderClock() {
    const H = this.H;
    if (H.ph !== "q" && !IMP_PHASES.includes(H.ph)) return;
    const ring = $("#ring"), n = $("#clock-n"), clock = $("#clock");
    if (!ring || !n) return;
    const left = Math.max(0, (H.phaseEnds - Date.now()) / 1000);
    ring.style.strokeDashoffset = String(100 * (1 - left / ((H.ph === "q" ? H.qDur : H.phDur || 1) / 1000)));
    const s = String(Math.ceil(left));
    if (n.textContent !== s) n.textContent = s;
    clock.classList.toggle("hurry", left <= 5);
  },
};

// =====================================================================
// Phone: a controller. Reads the TV's presence, publishes its own.
// =====================================================================
const PH = {
  pid: "", name: "", code: null, joined: false, photos: [], songs: [], search: null, playing: null, audio: null, host: null, hosts: [], uploading: null, g: null, cmd: null, deadline: 0, connected: false, confirmLeave: 0,

  // A photo is { id, b64, gid, up, prog, retryAt }. `up` means the server has it; `gid` is the game the TV used it in.
  start() {
    mode = "phone"; store.set("wiw.mode", { m: "phone", at: Date.now() });
    const s = store.get("wiw.phone") || {};
    this.pid = isPid(s.pid) ? s.pid : "p" + rid(9);
    this.name = cleanName(s.name);
    this.joined = !!(s.joined && this.name && s.code && (!hashCode || hashCode === s.code));
    this.code = hashCode || (this.joined ? s.code : null);
    this.photos = this.joined && Array.isArray(s.photos)
      ? s.photos.filter(p => isFid(p?.id) && (p.up || (typeof p.b64 === "string" && B64.test(p.b64))))
        .map(p => ({ id: p.id, b64: typeof p.b64 === "string" ? p.b64 : "", gid: p.gid || null, up: !!p.up, prog: 0, retryAt: 0 }))
      : [];
    this.songs = this.joined && Array.isArray(s.songs)
      ? s.songs.filter(x => x && /^\d{1,15}$/.test(String(x.id))).slice(0, SONGS_PER_PLAYER)
        .map(x => ({ id: String(x.id), t: cleanText(x.t), a: cleanText(x.a), art: isArt(x.art), ap: isArt(x.ap), gid: x.gid || null }))
      : [];
    app.innerHTML = `<div class="phone"><header class="ph-top" id="ph-top"></header><main class="ph-main" id="ph-main"></main></div>`;
    this.save();
    this.render();
    if (roomState === "ok") this.onRoom();
    setInterval(() => { this.pump(); this.renderClock(); }, 250);
    wake();
  },
  save() {
    const base = { pid: this.pid, name: this.name, code: this.code, joined: this.joined, songs: this.songs };
    // Uploaded photos can be shown from the server again, so only unsent ones keep their pixels here.
    const photos = this.photos.map(p => ({ id: p.id, gid: p.gid, up: p.up, b64: p.up ? undefined : p.b64 }));
    if (!store.set("wiw.phone", { ...base, photos })) store.set("wiw.phone", { ...base, photos: photos.filter(p => p.up) });
  },
  onRoom() {
    if (!room) return this.render();
    room.onPeers(ch => this.sync(ch.peers));
    room.onWhisper?.(d => this.gotWord(d));
    room.onConnection(c => { this.connected = c; this.render(); if (c) this.checkPhotos(); });
    this.connected = room.connected();
    this.push();
    this.render();
  },
  // After a reconnect, re-send photos the server lost; drop ones this phone can't re-send.
  async checkPhotos() {
    const ids = this.photos.filter(p => p.up).map(p => p.id);
    if (!ids.length) return;
    const ok = new Set(await room.have(ids));
    let dirty = false;
    this.photos = this.photos.filter(p => {
      if (!p.up || ok.has(p.id)) return true;
      dirty = true; p.up = false;
      return !!p.b64;
    });
    if (dirty) { this.save(); this.push(); this.renderMain(); }
  },

  sync(peers) {
    const hosts = peers.filter(p => p.presence?.app === APP && p.presence?.role === "h" && /^[A-Z]{4}$/.test(p.presence.code || ""));
    this.hosts = [...new Set(hosts.map(p => p.presence.code))];
    let h = null;
    if (this.code) h = hosts.filter(p => p.presence.code === this.code).sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
    else if (this.hosts.length === 1) { h = hosts[0]; this.code = h.presence.code; }
    const prev = this.host;
    this.host = h ? h.presence : null;
    if (this.host && this.host !== prev) {
      if (typeof this.host.left === "number") this.deadline = Date.now() + this.host.left * 1000;
      // Photos the TV took into a game belong to that game. A new lobby (Play again) starts with fresh picks.
      const mine = this.me()?.[5] || [];
      let dirty = false;
      for (const p of this.photos) if (!p.gid && mine.includes(p.id)) { p.gid = this.host.gid; dirty = true; }
      const mySongs = this.me()?.[6] || [];
      for (const x of this.songs) if (!x.gid && mySongs.includes(x.id)) { x.gid = this.host.gid; dirty = true; }
      if (this.host.ph !== "lobby" && this.playing) { this.audio?.pause(); this.playing = null; }
      if (this.host.ph === "lobby") {
        const old = this.photos.filter(p => p.gid && p.gid !== this.host.gid);
        if (old.length) {
          room?.drop(old.filter(p => p.up).map(p => p.id));
          this.photos = this.photos.filter(p => !old.includes(p));
          dirty = true;
        }
        const oldSongs = this.songs.filter(x => x.gid && x.gid !== this.host.gid);
        if (oldSongs.length) { this.songs = this.songs.filter(x => !oldSongs.includes(x)); dirty = true; }
      }
      if (dirty) { this.save(); this.push(); }
      if (this.cmd && this.host.ph !== (prev?.ph)) this.cmd = null;
    }
    this.pump();
    this.render();
  },
  me() { return this.host?.pl?.find(p => p[0] === this.pid) || null; },
  pl() { return Array.isArray(this.host?.pl) ? this.host.pl.filter(p => Array.isArray(p) && isPid(p[0])) : []; },
  nameOf(pid) { return this.pl().find(p => p[0] === pid) || null; },

  push() {
    if (!room || roomState !== "ok") return;
    if (!this.joined) { room.presence({ app: APP, role: "v", code: this.code || null, pid: null, nm: null, ph: null, sg: null, s: 0, g: null, cmd: null }).catch(() => {}); return; }
    room.presence({
      app: APP, role: "p", code: this.code, pid: this.pid, nm: this.name,
      ph: this.photos.filter(p => p.up).map(p => p.id).slice(0, PER_PLAYER),
      s: this.photos.filter(p => !p.up).length,
      sg: this.songs.map(x => [x.id, x.t, x.a, x.art, x.ap || ""]),
      g: this.g ?? null, cmd: this.cmd ?? null,
      wk: this.secret?.rk || null, sw: this.sw || null, dn: this.dn || null, rd: this.rd || null,
    }).catch(e => console.warn("presence", e));
  },

  // Upload queued photos one at a time; a failed upload retries a few seconds later.
  pump() {
    if (!this.joined || !this.code || !room?.connected() || this.uploading) return;
    const now = Date.now(), cur = this.photos.find(p => !p.up && p.b64 && now >= (p.retryAt || 0));
    if (cur) this.upload(cur);
  },
  async upload(p) {
    this.uploading = p.id; p.prog = 0; this.renderPhotos();
    try {
      await postPhoto(p.id, this.pid, this.code, p.b64, f => { p.prog = f; this.renderPhotos(); });
      p.up = true; p.retryAt = 0;
    } catch (e) {
      p.retryAt = Date.now() + 3000;
      if (e.status === 413 || e.status === 415) { this.photos = this.photos.filter(x => x !== p); this.err = "One photo was too big to send. Try another."; }
    }
    this.uploading = null;
    if (!this.photos.includes(p)) { if (p.up) room?.drop([p.id]); }
    this.save(); this.push(); this.renderMain(); this.pump();
  },
  status(p) {
    if (!p.up) return this.uploading === p.id ? "sending" : p.retryAt ? "retry" : "queued";
    const mine = this.me()?.[5] || [];
    if (mine.includes(p.id)) return "done";
    if (!this.host || this.host.ph !== "lobby") return "wait";
    return mine.length >= PER_PLAYER ? "bad" : "adding";
  },

  async addPhotos(files) {
    const space = PER_PLAYER - this.photos.length;
    const list = Array.from(files).slice(0, Math.max(0, space));
    this.busy = list.length; this.err = ""; this.renderMain();
    for (const f of list) {
      try {
        const b64 = await compress(f);
        if (!b64) throw new Error("empty");
        this.photos.push({ id: "f" + rid(9), b64, gid: null, up: false, prog: 0, retryAt: 0 });
      } catch { this.err = "One photo couldn't be read. Try a JPG or PNG."; }
      this.busy--; this.save(); this.push(); this.renderMain();
    }
    this.busy = 0; this.pump(); this.renderMain();
  },
  removePhoto(id) {
    const p = this.photos.find(x => x.id === id);
    this.photos = this.photos.filter(x => x.id !== id);
    if (p?.up) room?.drop([id]);
    this.save(); this.push(); this.renderMain();
  },

  act(a, el) {
    if (a === "join") {
      const name = cleanName($("#nm-in")?.value), code = ($("#code-in")?.value || this.code || "").toUpperCase().trim();
      if (!name) { this.err = "Type your name first."; return this.renderMain(true); }
      if (!/^[A-Z]{4}$/.test(code)) { this.err = "The room code is the 4 letters on the TV."; return this.renderMain(true); }
      this.name = name; this.code = code; this.joined = true; this.err = "";
      this.save(); this.push(); vibrate(20); return this.render();
    }
    if (a === "pick-host") { this.code = el.dataset.code; return this.render(); }
    if (a === "add") { fileIn.value = ""; return fileIn.click(); }
    if (a === "rm") return this.removePhoto(el.dataset.id);
    if (a === "song-add") {
      const x = this.search?.items.find(y => y.id === el.dataset.id);
      if (!x || this.songs.length >= SONGS_PER_PLAYER || this.songs.some(y => y.id === x.id)) return;
      this.songs.push({ id: x.id, t: cleanText(x.t), a: cleanText(x.a), art: isArt(x.art), ap: isArt(x.ap), gid: null });
      vibrate(15); this.save(); this.push(); return this.renderSongs();
    }
    if (a === "song-rm") { this.songs = this.songs.filter(y => y.id !== el.dataset.id); this.save(); this.push(); return this.renderSongs(); }
    if (a === "preview") return this.preview(el.dataset.id);
    if (a === "guess") {
      if (!this.host || this.host.ph !== "q" || this.g?.rk === this.host.rk) return;
      this.g = { rk: this.host.rk, p: el.dataset.pid }; vibrate(30); this.push(); return this.renderMain();
    }
    if (a === "peek") {
      if (!this.secret) return;
      this.showWord = Date.now() + 4000; this.sw = this.secret.rk; vibrate(15); this.push(); this.renderMain(true);
      clearTimeout(this.peekT); this.peekT = setTimeout(() => this.renderMain(true), 4100);
      return;
    }
    if (a === "imp-ready") {
      if (this.host?.ph !== "imp-talk") return;
      this.rd = this.host.rk; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "next-round") {
      if (this.host?.vip !== this.pid || this.host.ph !== "rev") return;
      this.cmd = { k: rid(6), a: "next" }; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "clue-done") {
      const H = this.host;
      if (!H?.imp || H.ph !== "imp-clue" || H.imp.sp !== this.pid) return;
      this.dn = H.rk + ":" + H.imp.turn; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "answer") {
      const i = Number(el.dataset.i), H = this.host;
      if (!H || H.ph !== "q" || !H.qz || this.g?.rk === H.rk || !Number.isInteger(i)) return;
      this.g = { rk: H.rk, i }; vibrate(30); this.push(); return this.renderMain();
    }
    if (a === "mode") { this.cmd = { k: rid(6), a: "mode:" + el.dataset.m }; this.push(); vibrate(15); return; }
    if (a === "start" || a === "again") {
      const cmd = this.cmd = { k: rid(6), a }; this.push(); vibrate(20);
      setTimeout(() => { if (this.cmd === cmd) { this.cmd = null; this.push(); this.renderMain(true); } }, 5000);
      return this.renderMain();
    }
    if (a === "leave") {
      if (Date.now() > this.confirmLeave) { this.confirmLeave = Date.now() + 3000; this.renderTop(); setTimeout(() => this.renderTop(), 3100); return; }
      room?.drop(this.photos.filter(p => p.up).map(p => p.id));
      this.joined = false; this.photos = []; this.songs = []; this.search = null; this.g = null; this.cmd = null; this.code = hashCode; this.confirmLeave = 0;
      this.save(); this.push(); return this.render();
    }
    if (a === "switch") { store.del("wiw.mode"); location.href = "/"; }
  },

  // ---------- phone rendering ----------
  render() { this.renderTop(); this.renderMain(); },
  renderTop() {
    const me = this.me(), leaving = Date.now() < this.confirmLeave;
    const status = roomState === "ok" && !this.connected ? `<span class="pill dark" style="font-size:12px">Reconnecting</span>` : "";
    paint($("#ph-top"), `${this.code}|${this.joined}|${me?.[1]}|${me?.[2]}|${leaving}|${this.connected}`, `
      <span class="logo">fafo</span>${status}
      <span class="room">${this.code ? "Room " + esc(this.code) : ""}</span>
      ${this.joined ? `<button class="btn ghost" data-act="leave">${leaving ? "Tap to leave" : "Leave"}</button>` : ""}
      ${this.joined && me ? `<span class="me" title="${esc(me[1])}">${avatar(me[1], me[2])}</span>` : ""}`);
  },
  renderMain(force) {
    const main = $("#ph-main");
    if (!main) return;
    if (force) main.dataset.sig = "";
    if (roomState === "none") return paint(main, "none", `<div class="card"><p class="ph-h">Can't reach the TV</p>
      <p>This phone couldn't load the game's live connection. Make sure you're on the same Wi-Fi as the laptop and the game is still running, then reload.</p>
      <button class="btn sm" data-act="switch">Back to start</button></div>`);
    if (!this.connected && !this.host) return paint(main, "conn", `<div class="card center"><p class="ph-h">Connecting…</p>
      <p class="muted">Reaching the laptop over Wi-Fi. If this takes more than a few seconds, check you're on the same Wi-Fi as the TV.</p></div>`);
    if (!this.joined) return this.rJoin(main);
    if (!this.host) {
      return paint(main, "find|" + this.code, `<div class="card center"><p class="ph-h">Looking for the TV…</p>
        <p class="muted">Make sure the TV shows room <b>${esc(this.code)}</b> on the fafo screen.</p>
        <button class="btn sm" data-act="leave">Use a different room</button></div>`);
    }
    const H = this.host, me = this.me();
    if (!me) return paint(main, "wait-in", `<div class="card center"><p class="ph-h">Joining…</p><p class="muted">Hang on while the TV adds you.</p></div>`);
    if (H.ph === "lobby") return this.rLobby(main);
    if (H.ph === "intro") return paint(main, "intro|" + H.rk, `<div class="card center result"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">Eyes on the TV</p><p class="muted">${H.kind === "imp" ? "Imposter round. Your secret word is coming." : "Get ready to guess."}</p></div>`);
    if (IMP_PHASES.includes(H.ph)) return this.rImp(main);
    if (H.ph === "q") return this.rQuestion(main);
    if (H.ph === "rev") return this.rReveal(main);
    if (H.ph === "lb" || H.ph === "end") return this.rStandings(main);
  },
  rJoin(main) {
    if (!this.code && this.hosts.length > 1) {
      return paint(main, "hosts|" + this.hosts.join(), `<div class="card"><p class="ph-h">Which TV?</p><p class="muted">More than one game is open. Pick the code shown on your TV.</p>
        <div class="hostlist">${this.hosts.map(c => `<button class="btn" data-act="pick-host" data-code="${esc(c)}">Room ${esc(c)}</button>`).join("")}</div></div>`);
    }
    const sig = "join|" + this.code + "|" + this.err;
    if (main.dataset.sig?.startsWith("join|") && main.dataset.sig === sig) return;
    const prevName = $("#nm-in")?.value;
    paint(main, sig, `<form class="card" id="join-form" novalidate>
      <p class="eyebrow">${this.code ? "Room " + esc(this.code) : "Join a game"}</p>
      <p class="ph-h">What should we call you?</p>
      <div class="field"><label for="nm-in">Your name</label><input id="nm-in" maxlength="14" autocomplete="nickname" enterkeyhint="go" value="${esc(prevName ?? this.name)}"></div>
      ${this.code ? "" : `<div class="field"><label for="code-in">Room code on the TV</label><input id="code-in" class="code-in" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD"></div>`}
      ${this.err ? `<p class="warn">${esc(this.err)}</p>` : ""}
      <button class="btn primary wide" data-act="join" type="submit">Join game</button>
    </form>`);
  },
  modes() { return Array.isArray(this.host?.modes) ? this.host.modes.filter(m => MODES.includes(m)) : ["photo"]; },
  rLobby(main) {
    const H = this.host, vip = H.vip === this.pid, modes = this.modes(), photos = modes.includes("photo"), songs = modes.includes("song");
    // The layout only changes with the game or the round types, so typing a song search isn't interrupted.
    paint(main, ["lobby", H.gid, modes.join(), vip].join("|"), `${photos ? `<section class="card">
        <p class="eyebrow">You're in</p>
        <p class="ph-h">Add your photos</p>
        <p class="muted">Pick up to ${PER_PLAYER}. Baby pictures, holiday shots, your pet, anything. Nobody sees them until they're on the TV.</p>
        <div class="thumbs" id="thumbs"></div><div id="photo-err"></div>
      </section>` : ""}
      ${songs ? `<section class="card">
        <p class="eyebrow">Whose song</p>
        <p class="ph-h">Pick up to ${SONGS_PER_PLAYER} songs</p>
        <p class="muted">Songs that say something about you. The TV plays a bit of each one and everyone guesses who picked it.</p>
        <div id="mysongs" class="songlist"></div>
        <form id="song-form" class="songsearch" novalidate><input id="song-q" placeholder="Search a song or artist" autocomplete="off" enterkeyhint="search"><button class="btn sm" type="submit">Search</button></form>
        <div id="song-results" class="songlist"></div>
      </section>` : ""}
      ${!photos && !songs ? `<section class="card"><p class="eyebrow">You're in</p><p class="ph-h">Get ready</p>
        <p class="muted">The TV asks the questions. Pick your answer here. The fastest right answer scores most.</p></section>` : ""}
      <section class="card" id="ctrl"></section>`);
    this.renderCtrl(); this.renderPhotos(); this.renderSongs();
  },
  renderCtrl() {
    const el = $("#ctrl");
    if (!el || !this.host) return;
    const H = this.host, vip = H.vip === this.pid, vipName = this.nameOf(H.vip)?.[1], ps = this.pl(), modes = this.modes();
    const brings = [modes.includes("photo") && "photos", modes.includes("song") && "songs"].filter(Boolean).join(" and ");
    const starting = this.cmd?.a === "start";
    const picker = vip
      ? `<div class="mode-pick">${MODES.map(m => `<button class="mode ${modes.includes(m) ? "on" : ""}" data-act="mode" data-m="${m}" aria-pressed="${modes.includes(m)}">${MODE_LABEL[m]}</button>`).join("")}</div>`
      : `<p class="muted">Tonight: ${modes.map(m => MODE_LABEL[m]).join(", ")}${H.th && H.th !== "Anything goes" ? ` · Theme: ${esc(H.th)}` : ""}</p>`;
    paint(el, [vip, H.can, starting, ps.map(p => p[0] + p[1]).join(), vipName, modes.join(), H.th].join("|"), `
      <p class="eyebrow">Rounds tonight</p>${picker}
      ${vip ? `<button class="btn primary wide" data-act="start" ${H.can && !starting ? "" : "disabled"}>${starting ? "Starting…" : "Start game"}</button>
        <p class="muted">${H.can ? (brings ? `Start when everyone's ${brings} are in.` : "Start when everyone's in.") : ownerOnly(H) ? "You can start once 2 players have added photos or songs." : "Waiting for players."}</p>`
      : `<p class="ph-h" style="font-size:20px">Waiting for ${esc(vipName || "the host")} to start</p>`}
      <div class="chips">${ps.map(p => `<span class="chip">${avatar(p[1], p[2])}${esc(p[1])}</span>`).join("")}</div>`);
  },
  renderSongs() {
    const mine = $("#mysongs"), res = $("#song-results");
    const onTv = this.me()?.[6] || [];
    if (mine) paint(mine, this.songs.map(x => x.id + (onTv.includes(x.id) ? 1 : 0)).join() + "|" + this.playing, this.songs.map(x => this.songRow(x, true, onTv.includes(x.id))).join(""));
    if (res) {
      const r = this.search;
      paint(res, JSON.stringify([r?.q, r?.state, (r?.items || []).map(x => x.id), this.songs.map(x => x.id), this.playing]),
        !r ? "" : r.state === "loading" ? `<p class="muted">Searching…</p>`
        : r.state === "error" ? `<p class="warn">Search isn't working right now. Try again in a moment.</p>`
        : r.items.length ? r.items.map(x => this.songRow(x, false)).join("") : `<p class="muted">No songs found for "${esc(r.q)}".</p>`);
    }
  },
  songRow(x, mine, onTv) {
    const have = this.songs.some(y => y.id === x.id), full = this.songs.length >= SONGS_PER_PLAYER;
    const play = `<button type="button" data-act="preview" data-id="${esc(x.id)}" aria-label="Play a bit of this song">${this.playing === x.id ? "■" : "▶"}</button>`;
    const btn = mine ? `<button type="button" data-act="song-rm" data-id="${esc(x.id)}">Remove</button>`
      : have ? `<button type="button" disabled>Added</button>` : `<button type="button" class="add" data-act="song-add" data-id="${esc(x.id)}" ${full ? "disabled" : ""}>Add</button>`;
    return `<div class="songrow ${mine ? "mine" : ""}"><img src="${esc(x.art)}" alt=""><span><b>${esc(x.t)}</b><small>${esc(x.a)}${mine ? (onTv ? " · on the TV" : " · sending…") : ""}</small></span>${play}${btn}</div>`;
  },
  async searchSongs() {
    const q = cleanText($("#song-q")?.value, 80);
    if (!q) return;
    $("#song-q")?.blur();
    this.search = { q, state: "loading", items: [] }; this.renderSongs();
    try {
      const r = await fetch("/api/music/search?q=" + encodeURIComponent(q));
      if (!r.ok) throw new Error("search " + r.status);
      const items = (await r.json()).filter(x => /^\d{1,15}$/.test(String(x.id))).map(x => ({ id: String(x.id), t: cleanText(x.t), a: cleanText(x.a), art: isArt(x.art), ap: isArt(x.ap) }));
      if (this.search?.q === q) this.search = { q, state: "ok", items };
    } catch { if (this.search?.q === q) this.search = { q, state: "error", items: [] }; }
    this.renderSongs();
  },
  preview(id) {
    this.audio ||= new Audio();
    if (this.playing === id) { this.audio.pause(); this.playing = null; return this.renderSongs(); }
    this.audio.src = "/api/music/play/" + encodeURIComponent(id);
    this.audio.onended = () => { this.playing = null; this.renderSongs(); };
    this.audio.play().catch(() => { this.playing = null; this.renderSongs(); });
    this.playing = id; this.renderSongs();
  },
  renderPhotos() {
    paint($("#photo-err"), this.err || "", this.err ? `<p class="warn">${esc(this.err)}</p>` : "");
    const el = $("#thumbs");
    if (!el) return;
    const LABEL = { done: "On the TV", wait: "Next game", bad: "TV is full", adding: "Adding…", retry: "Retrying…", queued: "Queued" };
    const label = (p, st) => st === "sending" ? `Sending ${Math.round((p.prog || 0) * 100)}%` : LABEL[st];
    const sts = this.photos.map(p => this.status(p));
    const sig = this.photos.map((p, i) => p.id + sts[i] + Math.round((p.prog || 0) * 20)).join() + "|" + this.busy;
    paint(el, sig, this.photos.map((p, i) => {
      const st = sts[i], pct = st === "done" ? 100 : st === "sending" ? Math.round((p.prog || 0) * 100) : 0;
      return `<div class="thumb ${st === "done" ? "done" : st === "bad" ? "bad" : ""}">
        <img src="${p.b64 ? "data:image/jpeg;base64," + p.b64 : photoSrc(p.id)}" alt="Your photo">
        <span class="st"><i style="--p:${pct}%"></i><span>${label(p, st)}</span></span>
        <button class="x" data-act="rm" data-id="${p.id}" aria-label="Remove this photo">×</button></div>`;
    }).join("")
      + (this.busy ? `<div class="addtile">Shrinking…</div>` : "")
      + (this.photos.length < PER_PLAYER && !this.busy ? `<button class="addtile" data-act="add">+ Add photos</button>` : ""));
  },
  rQuestion(main) {
    if (this.host.qz) return this.rQuiz(main);
    const H = this.host, owner = H.x === fnv(this.pid + H.rk);
    const tbar = H.kind === "imp" ? "" : `<div class="tbar" aria-hidden="true"><i id="tbar"></i></div>`;
    if (owner) return paint(main, "q-own|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">This one's yours</p><p class="muted">Keep a straight face. Every wrong guess earns you points.</p></div>`);
    if (this.g?.rk === H.rk) {
      const pick = this.nameOf(this.g.p);
      return paint(main, "q-lock|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">Locked in</p>${pick ? avatar(pick[1], pick[2]) : ""}<p class="ph-big">${esc(pick?.[1] || "?")}</p><p class="muted">Waiting for everyone else.</p></div>`);
    }
    const opts = this.pl().filter(p => p[0] !== this.pid);
    paint(main, "q|" + H.rk + "|" + opts.map(p => p[0]).join(), `${tbar}<div class="card"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}${H.R > 1 && H.r === H.R ? " · Double points" : ""}</p>
      <p class="ph-h">${esc(KIND_ASK_PHONE[H.kind] || KIND_ASK_PHONE.photo)}</p>
      <div class="choices">${opts.map(p => `<button class="choice" data-act="guess" data-pid="${p[0]}">${avatar(p[1], p[2])}<span>${esc(p[1])}</span></button>`).join("")}</div></div>`);
  },
  rQuiz(main) {
    const H = this.host, qz = H.qz, opts = Array.isArray(qz.o) ? qz.o.slice(0, 4).map(String) : [];
    const tbar = `<div class="tbar" aria-hidden="true"><i id="tbar"></i></div>`;
    if (this.g?.rk === H.rk && Number.isInteger(this.g.i)) {
      const k = this.g.i;
      return paint(main, "qz-lock|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">Locked in</p><span class="opt-pill" style="--oc:${OPT_COLORS[k]}"><b>${LETTERS[k]}</b>${esc(opts[k] ?? "")}</span><p class="muted">Waiting for everyone else.</p></div>`);
    }
    paint(main, "qz|" + H.rk, `${tbar}<div class="card"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · ${esc(MODE_LABEL[qz.t] || "")}${H.R > 1 && H.r === H.R ? " · Double points" : ""}</p>
      <p class="ph-h">${esc(qz.t === "tune" ? (qz.k === "artist" ? "Who's the artist?" : "What's the song?") : KIND_ASK_PHONE[qz.t] || "Pick an answer")}</p>
      <div class="answers">${opts.map((o, k) => `<button class="answer" style="--oc:${OPT_COLORS[k]}" data-act="answer" data-i="${k}"><b>${LETTERS[k]}</b><span>${esc(o)}</span></button>`).join("")}</div></div>`);
  },
  rQuizReveal(main) {
    const H = this.host, rv = H.rv, mine = rv.g?.[this.pid], pts = rv.d?.[this.pid] || 0, right = esc(H.qz.o?.[rv.a] ?? "");
    let cls = "", head, sub;
    if (mine === rv.a) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (Number.isInteger(mine)) { cls = "bad"; head = "Nope"; sub = `It was ${right}.`; }
    else { head = "Too slow"; sub = `It was ${right}.`; }
    paint(main, "qz-rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p></div>`);
  },
  // The TV sends each phone its own secret word for an Imposter round.
  gotWord(d) {
    if (!d || typeof d.rk !== "string" || (d.w !== null && typeof d.w !== "string")) return;
    this.secret = { rk: d.rk, w: d.w ? cleanText(d.w, 40) : null, cat: cleanText(d.cat, 30), odd: !!d.odd };
    this.push(); this.renderMain(true);
  },
  wordBox() {
    const s = this.secret, H = this.host;
    if (!s || s.rk !== H.rk) return `<div class="card center"><p class="muted">Getting your word…</p></div>`;
    if (!(this.showWord > Date.now())) return `<button class="secret" data-act="peek"><span class="eyebrow">Your secret word</span><b>Tap to see it</b><span>Don't let anyone see your screen</span></button>`;
    return `<button class="secret on" data-act="peek"><span class="eyebrow">${esc(s.cat)}</span><b>${s.w ? esc(s.w) : "You're the imposter"}</b><span>${s.w ? "Hides again in a few seconds" : "You have no word. Listen to the clues and blend in."}</span></button>`;
  },
  rImp(main) {
    const H = this.host, sp = H.imp?.sp, mine = sp && sp === this.pid, spName = this.nameOf(sp)?.[1];
    const done = this.dn === H.rk + ":" + H.imp?.turn;
    let top;
    if (H.ph === "imp-word") top = `<p class="ph-h">Check your word</p><p class="muted">Everyone has the same word except one person. Keep it to yourself.</p>`;
    else if (H.ph === "imp-clue") top = mine
      ? `<p class="ph-big">Your turn!</p><p class="muted">Say one word about your word out loud, then tap Done.</p><button class="btn primary wide" data-act="clue-done" ${done ? "disabled" : ""}>${done ? "Done" : "Done, next person"}</button>`
      : `<p class="ph-h">${esc(spName || "Someone")} is giving a clue</p><p class="muted">Listen. Does it fit your word?</p>`;
    else {
      const ready = this.rd === H.rk;
      top = `<p class="ph-h">Who's the imposter?</p><p class="muted">Talk it over, no rush. Voting opens once everyone is ready.</p>
        <button class="btn primary wide" data-act="imp-ready" ${ready ? "disabled" : ""}>${ready ? "Ready. Waiting for the others" : "Ready to vote"}</button>`;
    }
    paint(main, ["imp", H.ph, H.rk, sp, done, this.rd === H.rk, this.secret?.rk, this.showWord > Date.now()].join("|"), `<div class="card ${mine ? "center" : ""}">${top}</div>${this.wordBox()}`);
  },
  rImpReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, imp = rv.o, pts = rv.d?.[me] || 0;
    const impName = esc(this.nameOf(imp)?.[1] || "Someone"), theirs = rv.x ? `“${esc(rv.x)}”` : "no word";
    let cls, head, sub;
    if (imp === me) { cls = rv.caught ? "bad" : "good"; head = rv.caught ? "You got caught" : "You got away!"; sub = `${rv.caught ? "" : `+${fmt(pts)} points. `}You had ${theirs}. Everyone else had “${esc(rv.w)}”.`; }
    else if (rv.g?.[me] === imp) { cls = "good"; head = "You spotted it!"; sub = `+${fmt(pts)} points. ${impName} had ${theirs}.`; }
    else { cls = "bad"; head = "Not quite"; sub = `It was ${impName}. They had ${theirs}; everyone else had “${esc(rv.w)}”.`; }
    const vip = H.vip === me, asked = this.cmd?.a === "next";
    paint(main, ["imp-rev", H.rk, vip, asked].join("|"), `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Imposter</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p></div>
      ${vip ? `<button class="btn primary wide" data-act="next-round" ${asked ? "disabled" : ""}>${asked ? "Moving on…" : "Next round"}</button>` : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start the next round.</p>`}`);
  },
  rReveal(main) {
    if (this.host.kind === "imp") return this.rImpReveal(main);
    if (this.host.qz && this.host.rv && "a" in this.host.rv) return this.rQuizReveal(main);
    const H = this.host, rv = H.rv || { g: {}, d: {} }, ownerP = this.nameOf(rv.o);
    const pts = rv.d?.[this.pid] || 0, mine = rv.g?.[this.pid];
    let cls = "", head = "", sub = "";
    if (rv.o === this.pid) {
      const fooled = Object.values(rv.g || {}).filter(x => x !== rv.o).length;
      cls = fooled ? "good" : ""; head = fooled ? `You fooled ${fooled}!` : "Nobody fell for it";
      sub = pts ? `+${fmt(pts)} points` : "No points this time.";
    } else if (mine && mine === rv.o) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (mine) { cls = "bad"; head = "Nope"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    else { head = "Too slow"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    paint(main, "rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p></div>`);
  },
  rStandings(main) {
    const H = this.host, ps = this.pl().slice().sort((a, b) => b[3] - a[3]), me = this.me();
    const rank = me ? 1 + ps.filter(p => p[3] > me[3]).length : 0;
    const end = H.ph === "end", vip = H.vip === this.pid;
    paint(main, [H.ph, H.rk, H.gid, me?.[3], vip, !!this.cmd, JSON.stringify(H.aw || null)].join("|"), `<div class="card center result ${end && rank === 1 ? "good" : ""}">
        <p class="eyebrow">${end ? "Final scores" : "Scores so far"}</p>
        <p class="ph-big">${me ? (end && rank === 1 ? "You win!" : ordinal(rank) + " place") : "Next game"}</p>
        ${me ? `<p style="font-weight:800;font-size:20px" class="num">${fmt(me[3])} points</p>` : ""}
        ${end ? (H.aw || []).filter(a => a[0] === this.pid).map(a => `<p class="eyebrow">Award: ${esc(a[1])}</p><p class="muted">${esc(a[2])}</p>`).join("") : ""}
      </div>
      ${end ? (vip ? `<button class="btn primary wide" data-act="again" ${this.cmd ? "disabled" : ""}>${this.cmd ? "Starting…" : "Play again"}</button>${(H.modes || []).includes("photo") ? `<p class="muted" style="text-align:center">Everyone picks new photos for the next game.</p>` : ""}`
        : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start another game.</p>`) : ""}`);
  },
  renderClock() {
    const bar = $("#tbar"), H = this.host;
    if (!bar || !H || H.ph !== "q" || H.kind === "imp") return;
    const total = Q_SECS;
    const left = Math.max(0, (this.deadline - Date.now()) / 1000);
    bar.style.width = Math.min(100, left / total * 100).toFixed(1) + "%";
  },
};

// ---------- events ----------
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "go-tv") return TV.start();
  if (a === "go-phone") return PH.start();
  if (mode === "tv") TV.act(a, b);
  else if (mode === "phone") { if (a === "join") e.preventDefault(); PH.act(a, b); }
});
app.addEventListener("change", e => {
  if (mode !== "tv") return;
  if (e.target.id === "tune-sel") TV.setTune(e.target.value, e.target.selectedOptions[0]?.textContent);
  if (e.target.id === "face-sel") TV.setFaceCat(e.target.value);
  if (e.target.id === "theme-sel") TV.setTheme(e.target.value);
  if (e.target.id === "len-sel") TV.setLen(e.target.value);
  if (e.target.id === "imp-sel") TV.setImpVar(e.target.value);
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (mode === "tv" && e.target.id === "tune-form") return TV.setTune($("#tune-in")?.value, null);
  if (mode === "phone" && e.target.id === "song-form") return PH.searchSongs();
  if (mode === "phone") PH.act("join");
});
fileIn.addEventListener("change", () => {
  const files = Array.from(fileIn.files || []);
  if (!files.length) return;
  if (mode === "tv") TV.addPhotos(files); else if (mode === "phone") PH.addPhotos(files);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode) wake(); });
// A new room code after the # (another QR code opened in the same tab) starts the page fresh.
addEventListener("hashchange", () => location.reload());

// ---------- boot ----------
const last = store.get("wiw.mode");
if (location.pathname === "/tv") TV.start();
else if (hashCode) PH.start();
else if (last && Date.now() - (last.at || 0) < 4 * 3600e3 && (last.m === "tv" || last.m === "phone")) (last.m === "tv" ? TV : PH).start();
else renderLanding();
})();
</script>
</body>
</html>
