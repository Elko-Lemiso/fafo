        <p class="eyebrow">Clue ${H.turn + 1} of ${cur.order.length} · ${esc(cur.cat)}</p>
        <div class="speaker">${sp ? face(sp) : ""}<h2 class="big-name">${esc(sp?.name || "Next up")}</h2></div>
        <p class="lede">Say one word about your word, out loud. Not too obvious, not too vague. Then tap Done on your phone.</p>
        <ol class="turns">${cur.order.map((pid, i) => P[pid] ? `<li class="${i < H.turn ? "done" : i === H.turn ? "now" : ""}">${face(P[pid])}<span>${esc(P[pid].name)}</span></li>` : "").join("")}</ol></section>`);
    }
    if (H.ph === "imp-talk") {
      paint(stage, "impt|" + H.rk, `<section class="imp">${head}<h2 class="qtitle">Who's the imposter?</h2>
        <p class="lede">Take as long as you like. Whose clue didn't quite fit? Tap Ready to vote on your phone when you've made up your mind.</p>${meter}</section>`);
      return progress("Ready to vote", online.filter(p => p.rd === H.rk).length, online.length);
    }
    paint(stage, "impv|" + H.rk, `<section class="imp">${head}<h2 class="qtitle">Vote now</h2>
      <p class="lede">Pick the imposter on your phone. The answer shows once everyone has voted.</p>${meter}</section>`);
    this.renderLocks(null);
  },
  impRevealHtml() {
    const H = this.H, rv = H.rv || { g: {}, d: {} }, P = H.players, imp = P[rv.o];
    const votes = this.votesBy(rv.g);
    const ids = new Set(Object.keys(votes)); if (rv.o) ids.add(rv.o);
    const rows = [...ids].filter(id => P[id]).sort((a, b) => (votes[b]?.length || 0) - (votes[a]?.length || 0));
    const nv = Object.keys(rv.g || {}).length, t = 1.4 + rows.length * 0.25;
    const spotted = Object.entries(rv.g || {}).filter(([pid, pick]) => pid !== rv.o && pick === rv.o).length;
    const rowHtml = rows.map((id, i) => `<li class="${id === rv.o ? "win" : ""}">${face(P[id])}<span class="nm">${esc(P[id].name)}</span>${this.votersHtml(votes[id] || [], i)}</li>`).join("");
    const result = rv.caught ? (H.anon ? `<span class="delta">Caught! ${spotted} ${spotted === 1 ? "person" : "people"} spotted the imposter</span>` : `<span class="delta">Caught!</span>${this.scorersHtml(rv, "", "")}`)
      : imp ? `<span class="delta">${face(imp)}${esc(imp.name)} got away <b class="num">+${fmt(rv.d?.[rv.o] || 0)}</b></span>` : "";
    return `<section class="rgrid impr" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto bigav"><p class="eyebrow">The imposter was</p>${imp ? face(imp) : ""}${imp ? `<div class="stamp low">${esc(imp.name)}!</div>` : ""}</div>
      <div class="rside">
        <p class="eyebrow">${nv ? "Votes" : "Nobody voted"}${rv.m > 1 ? " · Double points" : ""}</p>
        <ul class="rows">${rowHtml}</ul>
        <p class="words"><span>Everyone: <b>${esc(rv.w)}</b></span><span>${esc(imp?.name || "Imposter")}: <b>${rv.x ? esc(rv.x) : "no word"}</b></span></p>
        <div class="deltas">${result}${this.sipHtml()}</div>
        <p class="credit">${P[H.vip] ? `${esc(P[H.vip].name)} starts the next round from their phone, or press Next here.` : "Press Next to carry on."}</p>
      </div></section>`;
  },
  renderClock() {
    const H = this.H;
    if (H.ph !== "q" && H.ph !== "qw" && H.ph !== "qv" && !IMP_PHASES.includes(H.ph)) return;
    const ring = $("#ring"), n = $("#clock-n"), clock = $("#clock");
    if (!ring || !n) return;
    const left = Math.max(0, (H.phaseEnds - (H.pause ? H.pause.at : Date.now())) / 1000);
    ring.style.strokeDashoffset = String(100 * (1 - left / ((H.ph === "q" ? H.qDur : H.phDur || 1) / 1000)));
    const s = String(Math.ceil(left));
    if (n.textContent !== s) n.textContent = s;
    clock.classList.toggle("hurry", left <= 5);
    // Ticks for the last five seconds, unless everyone has already answered and the clock was cut short.
    const k = Math.ceil(left);
    if (H.ph === "q" && H.phaseEnds && !H.pause && k <= 5 && k >= 1 && k !== this.lastTick && H.phaseEnds === H.qStart + H.qDur) { this.lastTick = k; SFX.play("tick"); if (k === 5 && !["song", "tune"].includes(H.cur?.t) && Math.random() < 0.5) this.say("hurry"); }
  },
};

// =====================================================================
// Phone: a controller. Reads the TV's presence, publishes its own.
// =====================================================================
const PH = {
  pid: "", name: "", code: null, joined: false, photos: [], songs: [], search: null, playing: null, audio: null, host: null, hosts: [], uploading: null, g: null, cmd: null, deadline: 0, connected: false, confirmLeave: 0,

  // A photo is { id, b64, gid, up, prog, retryAt }. `up` means the server has it; `gid` is the game the TV used it in.
  start() {
    mode = "phone"; store.set("wiw.mode", { m: "phone", at: Date.now() });
    const s = store.get("wiw.phone") || {};
    this.pid = isPid(s.pid) ? s.pid : "p" + rid(9);
    this.name = cleanName(s.name);
    this.joined = !!(s.joined && this.name && s.code && (!hashCode || hashCode === s.code));
    this.code = hashCode || (this.joined ? s.code : null);
    this.photos = this.joined && Array.isArray(s.photos)
      ? s.photos.filter(p => isFid(p?.id) && (p.up || (typeof p.b64 === "string" && B64.test(p.b64))))
        .map(p => ({ id: p.id, b64: typeof p.b64 === "string" ? p.b64 : "", gid: p.gid || null, up: !!p.up, prog: 0, retryAt: 0 }))
      : [];
    this.songs = this.joined && Array.isArray(s.songs)
      ? s.songs.filter(x => x && /^\d{1,15}$/.test(String(x.id))).slice(0, SONGS_PER_PLAYER)
        .map(x => ({ id: String(x.id), t: cleanText(x.t), a: cleanText(x.a), art: isArt(x.art), ap: isArt(x.ap), gid: x.gid || null }))
      : [];
    // The selfie: `ak` proves to the server it's this phone's, `av` is its version, `avB64` the picture itself.
    this.ak = typeof s.ak === "string" && /^[a-z0-9]{16}$/.test(s.ak) ? s.ak : rid(16);
    this.avB64 = typeof s.avB64 === "string" && s.avB64.length < 200000 && B64.test(s.avB64) ? s.avB64 : "";
    this.av = this.avB64 ? fnv(this.avB64).slice(0, 10) : null; this.avUp = false;
    if (this.avB64) AV[this.pid] = "data:image/jpeg;base64," + this.avB64;
    // Quick profile: answers by question id, the questions this phone is showing, and the game they were picked for.
    this.pf = {};
    if (s.pf && typeof s.pf === "object") for (const [k, v] of Object.entries(s.pf).slice(-12)) if (/^[a-z0-9-]{1,20}$/.test(k) && Number.isInteger(v)) this.pf[k] = v;
    this.pfQs = Array.isArray(s.pfQs) ? s.pfQs.filter(k => typeof k === "string").slice(0, 6) : [];
    this.pfGid = typeof s.pfGid === "string" ? s.pfGid : null;
    app.innerHTML = `<div class="phone"><header class="ph-top" id="ph-top"></header><main class="ph-main" id="ph-main"></main><footer class="ph-foot" id="ph-foot"></footer></div>`;
    this.save();
    this.render();
    if (roomState === "ok") this.onRoom();
    setInterval(() => { this.pump(); this.renderClock(); }, 250);
    wake();
  },
  save() {
    const base = { pid: this.pid, name: this.name, code: this.code, joined: this.joined, songs: this.songs, ak: this.ak, avB64: this.avB64, pf: this.pf, pfQs: this.pfQs, pfGid: this.pfGid };
    // Uploaded photos can be shown from the server again, so only unsent ones keep their pixels here.
    const photos = this.photos.map(p => ({ id: p.id, gid: p.gid, up: p.up, b64: p.up ? undefined : p.b64 }));
    if (!store.set("wiw.phone", { ...base, photos })) store.set("wiw.phone", { ...base, photos: photos.filter(p => p.up) });
  },
  onRoom() {
    if (!room) return this.render();
    room.onPeers(ch => this.sync(ch.peers));
    room.onWhisper?.(d => this.gotWord(d));
    room.onConnection(c => { this.connected = c; this.render(); if (c) { this.checkPhotos(); this.sendSelfie(); } });
    this.connected = room.connected();
    if (this.connected) this.sendSelfie();
    this.push();
    this.render();
  },
  async setSelfie(file) {
    try {
      const b64 = await compressSquare(file);
      if (!b64) throw new Error("empty");
      this.avB64 = b64; this.av = fnv(b64).slice(0, 10); this.avUp = false; this.err = "";
      AV[this.pid] = "data:image/jpeg;base64," + b64;
    } catch { this.err = "That picture couldn't be read. Try another."; }
    this.save(); this.render(); this.renderSelfie();
    this.sendSelfie();
  },
  async sendSelfie() {
    if (!this.avB64 || !this.joined) return;
    try {
      const bin = atob(this.avB64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      const r = await fetch("/api/avatar/" + this.pid, { method: "POST", headers: { "Content-Type": "image/jpeg", "X-Key": this.ak }, body: buf });
      if (r.status !== 201) throw new Error("selfie " + r.status);
      this.avUp = true; this.push();
    } catch { this.avUp = false; }
  },
  removeSelfie() {
    if (this.avB64) fetch("/api/avatar/" + this.pid, { method: "DELETE", headers: { "X-Key": this.ak } }).catch(() => {});
    this.avB64 = ""; this.av = null; this.avUp = false; delete AV[this.pid];
    this.save(); this.push(); this.render(); this.renderSelfie();
  },
  // After a reconnect, re-send photos the server lost; drop ones this phone can't re-send.
  async checkPhotos() {
    const ids = this.photos.filter(p => p.up).map(p => p.id);
    if (!ids.length) return;
    const ok = new Set(await room.have(ids));
    let dirty = false;
    this.photos = this.photos.filter(p => {
      if (!p.up || ok.has(p.id)) return true;
      dirty = true; p.up = false;
      return !!p.b64;
    });
    if (dirty) { this.save(); this.push(); this.renderMain(); }
  },

  sync(peers) {
    const hosts = peers.filter(p => p.presence?.app === APP && p.presence?.role === "h" && /^[A-Z]{4}$/.test(p.presence.code || ""));
    this.hosts = [...new Set(hosts.map(p => p.presence.code))];
    let h = null;
    if (this.code) h = hosts.filter(p => p.presence.code === this.code).sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
    else if (this.hosts.length === 1) { h = hosts[0]; this.code = h.presence.code; }
    const prev = this.host;
    this.host = h ? h.presence : null;
    if (this.host && this.host !== prev) {
      if (typeof this.host.left === "number") this.deadline = Date.now() + this.host.left * 1000;
      // Photos the TV took into a game belong to that game. A new lobby (Play again) starts with fresh picks.
      const mine = this.me()?.[5] || [];
      let dirty = false;
      for (const p of this.photos) if (!p.gid && mine.includes(p.id)) { p.gid = this.host.gid; dirty = true; }
      const mySongs = this.me()?.[6] || [];
      for (const x of this.songs) if (!x.gid && mySongs.includes(x.id)) { x.gid = this.host.gid; dirty = true; }
      if (this.host.ph !== "lobby" && this.playing) { this.audio?.pause(); this.playing = null; }
      if (this.host.ph === "lobby") {
        const old = this.photos.filter(p => p.gid && p.gid !== this.host.gid);
        if (old.length) {
          room?.drop(old.filter(p => p.up).map(p => p.id));
          this.photos = this.photos.filter(p => !old.includes(p));
          dirty = true;
        }
        const oldSongs = this.songs.filter(x => x.gid && x.gid !== this.host.gid);
        if (oldSongs.length) { this.songs = this.songs.filter(x => !oldSongs.includes(x)); dirty = true; }
      }
      if (dirty) { this.save(); this.push(); }
      if (this.cmd && this.host.ph !== (prev?.ph)) this.cmd = null;
    }
    for (const p of this.pl()) if (p[0] !== this.pid) setAV(p[0], p[7]);
    this.pump();
    this.render();
  },
  me() { return this.host?.pl?.find(p => p[0] === this.pid) || null; },
  pl() { return Array.isArray(this.host?.pl) ? this.host.pl.filter(p => Array.isArray(p) && isPid(p[0])) : []; },
  nameOf(pid) { return this.pl().find(p => p[0] === pid) || null; },

  push() {
    if (!room || roomState !== "ok") return;
    if (!this.joined) { room.presence({ app: APP, role: "v", code: this.code || null, pid: null, nm: null, ph: null, sg: null, s: 0, g: null, cmd: null }).catch(() => {}); return; }
    room.presence({
      app: APP, role: "p", code: this.code, pid: this.pid, nm: this.name,
      ph: this.photos.filter(p => p.up).map(p => p.id).slice(0, PER_PLAYER),
      s: this.photos.filter(p => !p.up).length,
      sg: this.songs.map(x => [x.id, x.t, x.a, x.art, x.ap || ""]),
      g: this.g ?? null, cmd: this.cmd ?? null,
      wk: this.secret?.rk || null, sw: this.sw || null, dn: this.dn || null, rd: this.rd || null,
      av: this.avUp ? this.av : null, pf: this.pf, qa: this.qa || null,
    }).catch(e => console.warn("presence", e));
  },

  // Upload queued photos one at a time; a failed upload retries a few seconds later.
  pump() {
    if (!this.joined || !this.code || !room?.connected() || this.uploading) return;
    const now = Date.now(), cur = this.photos.find(p => !p.up && p.b64 && now >= (p.retryAt || 0));
    if (cur) this.upload(cur);
  },
  async upload(p) {
    this.uploading = p.id; p.prog = 0; this.renderPhotos();
    try {
      await postPhoto(p.id, this.pid, this.code, p.b64, f => { p.prog = f; this.renderPhotos(); });
      p.up = true; p.retryAt = 0;
    } catch (e) {
      p.retryAt = Date.now() + 3000;
      if (e.status === 413 || e.status === 415) { this.photos = this.photos.filter(x => x !== p); this.err = "One photo was too big to send. Try another."; }
    }
    this.uploading = null;
    if (!this.photos.includes(p)) { if (p.up) room?.drop([p.id]); }
    this.save(); this.push(); this.renderMain(); this.pump();
  },
  status(p) {
    if (!p.up) return this.uploading === p.id ? "sending" : p.retryAt ? "retry" : "queued";
    const mine = this.me()?.[5] || [];
    if (mine.includes(p.id)) return "done";
    if (!this.host || this.host.ph !== "lobby") return "wait";
    return mine.length >= PER_PLAYER ? "bad" : "adding";
  },

  async addPhotos(files) {
    const space = PER_PLAYER - this.photos.length;
    const list = Array.from(files).slice(0, Math.max(0, space));
    this.busy = list.length; this.err = ""; this.renderMain();
    for (const f of list) {
      try {
        const b64 = await compress(f);
        if (!b64) throw new Error("empty");
        this.photos.push({ id: "f" + rid(9), b64, gid: null, up: false, prog: 0, retryAt: 0 });
      } catch { this.err = "One photo couldn't be read. Try a JPG or PNG."; }
      this.busy--; this.save(); this.push(); this.renderMain();
    }
    this.busy = 0; this.pump(); this.renderMain();
  },
  removePhoto(id) {
    const p = this.photos.find(x => x.id === id);
    this.photos = this.photos.filter(x => x.id !== id);
    if (p?.up) room?.drop([id]);
    this.save(); this.push(); this.renderMain();
  },

  act(a, el) {
    if (a === "join") {
      const name = cleanName($("#nm-in")?.value), code = ($("#code-in")?.value || this.code || "").toUpperCase().trim();
      if (!name) { this.err = "Type your name first."; return this.renderMain(true); }
      if (!/^[A-Z]{4}$/.test(code)) { this.err = "The room code is the 4 letters on the TV."; return this.renderMain(true); }
      this.name = name; this.code = code; this.joined = true; this.err = "";
      this.save(); this.push(); vibrate(20); this.sendSelfie(); return this.render();
    }
    if (a === "pick-host") { this.code = el.dataset.code; return this.render(); }
    if (a === "add") { fileIn.value = ""; return fileIn.click(); }
    if (a === "rm") return this.removePhoto(el.dataset.id);
    if (a === "song-add") {
      const x = this.search?.items.find(y => y.id === el.dataset.id);
      if (!x || this.songs.length >= SONGS_PER_PLAYER || this.songs.some(y => y.id === x.id)) return;
      this.songs.push({ id: x.id, t: cleanText(x.t), a: cleanText(x.a), art: isArt(x.art), ap: isArt(x.ap), gid: null });
      vibrate(15); this.save(); this.push(); return this.renderSongs();
    }
    if (a === "song-rm") { this.songs = this.songs.filter(y => y.id !== el.dataset.id); this.save(); this.push(); return this.renderSongs(); }
    if (a === "preview") return this.preview(el.dataset.id);
    if (a === "guess") {
      if (!this.host || this.host.ph !== "q" || this.g?.rk === this.host.rk) return;
      this.g = { rk: this.host.rk, p: el.dataset.pid }; vibrate(30); this.push(); return this.renderMain();
    }
    if (a === "peek") {
      if (!this.secret) return;
      this.showWord = Date.now() + 4000; this.sw = this.secret.rk; vibrate(15); this.push(); this.renderMain(true);
      clearTimeout(this.peekT); this.peekT = setTimeout(() => this.renderMain(true), 4100);
      return;
    }
    if (a === "imp-ready") {
      if (this.host?.ph !== "imp-talk") return;
      this.rd = this.host.rk; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "next-round") {
      if (this.host?.vip !== this.pid || this.host.ph !== "rev") return;
      this.cmd = { k: rid(6), a: "next" }; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "clue-done") {
      const H = this.host;
      if (!H?.imp || H.ph !== "imp-clue" || H.imp.sp !== this.pid) return;
      this.dn = H.rk + ":" + H.imp.turn; vibrate(20); this.push(); return this.renderMain(true);
    }
    if (a === "answer") {
      const i = Number(el.dataset.i), H = this.host;
      if (!H || H.ph !== "q" || !H.qz || this.g?.rk === H.rk || !Number.isInteger(i)) return;
      this.g = { rk: H.rk, i }; vibrate(30); this.push(); return this.renderMain();
    }
    if (a === "mode") { this.cmd = { k: rid(6), a: "mode:" + el.dataset.m }; this.push(); vibrate(15); return; }
    if (a === "qvote") {
      const i = Number(el.dataset.i), H = this.host;
      if (!H || H.ph !== "qv" || this.g?.rk === H.rk || !Number.isInteger(i)) return;
      this.g = { rk: H.rk, i }; vibrate(30); this.push(); return this.renderMain();
    }
    if (a === "toofar") {
      const H = this.host;
      if (!H?.sp || !H.rk) return;
      this.cmd = { k: rid(6), a: "toofar:" + H.rk }; this.tooFarAt = H.rk; vibrate(20); this.push(); return this.renderFoot();
    }
    if (a === "selfie") { $("#selfie-in").value = ""; return $("#selfie-in").click(); }
    if (a === "selfie-rm") return this.removeSelfie();
    if (a === "pf") {
      const q = el.dataset.q, i = Number(el.dataset.i);
      if (!/^[a-z0-9-]{1,20}$/.test(q) || !Number.isInteger(i)) return;
      delete this.pf[q]; this.pf[q] = i; // re-added so the newest answers are the ones kept
      const keys = Object.keys(this.pf); while (keys.length > 12) delete this.pf[keys.shift()];
      vibrate(12); this.save(); this.push(); return this.renderProf();
    }
    if (a === "pause" || a === "resume") { if (this.host?.vip !== this.pid) return; this.cmd = { k: rid(6), a }; this.push(); vibrate(15); return; }
    if (a === "start" || a === "again") {
      const cmd = this.cmd = { k: rid(6), a }; this.push(); vibrate(20);
      setTimeout(() => { if (this.cmd === cmd) { this.cmd = null; this.push(); this.renderMain(true); } }, 5000);
      return this.renderMain();
    }
    if (a === "leave") {
      if (Date.now() > this.confirmLeave) { this.confirmLeave = Date.now() + 3000; this.renderTop(); setTimeout(() => this.renderTop(), 3100); return; }
      room?.drop(this.photos.filter(p => p.up).map(p => p.id));
      this.joined = false; this.photos = []; this.songs = []; this.search = null; this.g = null; this.cmd = null; this.code = hashCode; this.confirmLeave = 0;
      this.save(); this.push(); return this.render();
    }
    if (a === "switch") { store.del("wiw.mode"); location.href = "/"; }
  },

  // ---------- phone rendering ----------
  render() { this.renderTop(); this.renderMain(); this.renderFoot(); },
  // Whoever starts the game can pause it from their phone too.
  renderFoot() {
    const H = this.host, live = this.joined && H && !["lobby", "end", "lb"].includes(H.ph) && !H.pause;
    const pause = live && H.vip === this.pid, far = live && H.sp && ["intro", "q", "qw", "qv"].includes(H.ph) && this.tooFarAt !== H.rk;
    paint($("#ph-foot"), [pause, far].join(), (far ? `<button class="btn sm" data-act="toofar">Too far</button>` : "") + (pause ? `<button class="btn sm" data-act="pause">Pause game</button>` : ""));
  },
  // Quips: this phone's prompts with a box for each. Sent answers are final.
  rWrite(main) {
    const H = this.host, qp = H.qp || {}, tbar = `<div class="tbar" aria-hidden="true"><i id="tbar"></i></div>`;
    if (qp.ttl) return this.rWriteTtl(main, tbar);
    const mine = typeof qp.lash === "string" ? [[0, qp.lash]] : (Array.isArray(qp.ps) ? qp.ps : []).map((m, i) => [i, m?.[0], m?.[1]]).filter(x => Array.isArray(x[2]) && x[2].includes(this.pid)).map(x => [x[0], String(x[1] || "")]);
    if (this.qa?.rk !== H.rk) this.qa = { rk: H.rk, a: {} };
    const sent = mine.filter(([i]) => this.qa.a[i]);
    if (!mine.length) return paint(main, "qw-none|" + H.rk, `${tbar}<div class="card center result"><p class="ph-big">Sit tight</p><p class="muted">You joined after the prompts went out. You can vote in a moment.</p></div>`);
    // Keep whatever is typed in a box that's still open when another one is sent.
    const typed = {}; for (const [i] of mine) { const el = $("#qa-in-" + i); if (el) typed[i] = el.value; }
    const done = sent.length === mine.length;
    const mates = i => (Array.isArray(qp.ps?.[i]?.[1]) ? qp.ps[i][1] : []).filter(x => x !== this.pid).map(x => esc(this.nameOf(x)?.[1] || "?")).join(" and ");
    const did = paint(main, ["qw", H.rk, sent.map(x => x[0]).join()].join("|"), `${tbar}${mine.map(([i, q]) => this.qa.a[i]
      ? `<div class="card"><p class="eyebrow">Sent</p><p class="ph-q">${esc(q)}</p><p class="ph-h" style="font-size:22px">${esc(this.qa.a[i])}</p></div>`
      : `<form class="card qa-form" data-i="${i}" novalidate><p class="eyebrow">${qp.bluff ? "Bluff" : qp.said ? "Who said it" : qp.meld ? `Mind meld with ${mates(i)}` : H.kind === "lash" ? "Last Lash" : `Prompt ${mine.findIndex(x => x[0] === i) + 1} of ${mine.length}`}</p><p class="ph-h" style="font-size:22px">${esc(q)}</p>
          ${qp.meld ? `<p class="muted">Type what you think ${mates(i)} will type. No talking! Same answer and you both score.</p>` : ""}
          ${qp.said ? `<p class="muted">Answer honestly. The TV shows it later and everyone guesses it was you. Same answer as someone else? Then it isn't played.</p>` : ""}
          <div class="field"><label for="qa-in-${i}">${qp.bluff ? "A fake answer that sounds true" : "Your answer"}</label><input id="qa-in-${i}" maxlength="70" autocomplete="off" enterkeyhint="send"></div>
          <button class="btn primary wide" type="submit">Send</button></form>`).join("")}
      ${done ? `<p class="muted" style="text-align:center">All sent. Waiting for the others.</p>` : ""}`);
    if (did) for (const [i, v] of Object.entries(typed)) { const el = $("#qa-in-" + i); if (el) el.value = v; }
  },
  // Two truths and a lie: three boxes, sent together. The third is the lie; the TV shuffles them.
  rWriteTtl(main, tbar) {
    const H = this.host;
    if (this.qa?.rk !== H.rk) this.qa = { rk: H.rk, a: {} };
    const a = this.qa.a, sent = [0, 1, 2].every(i => a[i]), LBL = ["A truth", "Another truth", "Your lie"];
    if (sent) return paint(main, "ttl-sent|" + H.rk, `${tbar}<div class="card"><p class="eyebrow">Sent</p>${[0, 1, 2].map(i => `<p class="muted">${LBL[i]}</p><p class="ph-q">${esc(a[i])}</p>`).join("")}</div>
      <p class="muted" style="text-align:center">Waiting for the others. When yours comes up, keep a straight face.</p>`);
    const typed = [0, 1, 2].map(i => $("#ttl-" + i)?.value);
    const did = paint(main, ["ttl", H.rk, this.ttlErr || ""].join("|"), `${tbar}<form class="card ttl-form" novalidate><p class="eyebrow">Two truths and a lie</p><p class="ph-h" style="font-size:22px">Two true things about you, and one lie</p>
      <p class="muted">Make the truths surprising and the lie believable: a place you've been, a job you had, someone you've met, a weird talent. The TV mixes them up.</p>
      ${[0, 1, 2].map(i => `<div class="field"><label for="ttl-${i}">${LBL[i]}</label><input id="ttl-${i}" maxlength="70" autocomplete="off" enterkeyhint="${i < 2 ? "next" : "send"}"></div>`).join("")}
      ${this.ttlErr ? `<p class="warn">${esc(this.ttlErr)}</p>` : ""}<button class="btn primary wide" type="submit">Send all three</button></form>`);
    if (did) typed.forEach((v, i) => { const el = $("#ttl-" + i); if (el && v) el.value = v; });
  },
  // Enter in a box moves on to the next empty one; only the button complains about what's missing.
  sendTtl(button) {
    const H = this.host, vals = [0, 1, 2].map(i => cleanText($("#ttl-" + i)?.value, 70));
    if (!H || H.ph !== "qw" || this.qa?.rk !== H.rk) return;
    const empty = vals.findIndex(v => !v);
    if (empty >= 0 && !button) return $("#ttl-" + empty)?.focus();
    if (empty >= 0) { this.ttlErr = empty === 2 ? "Add your lie too." : "Fill in both truths."; this.renderMain(); return $("#ttl-" + empty)?.focus(); }
    this.ttlErr = ""; this.qa.a = { 0: vals[0], 1: vals[1], 2: vals[2] }; vibrate(25); this.push(); this.renderMain();
  },
  sendQuip(i) {
    const H = this.host, text = cleanText($("#qa-in-" + i)?.value, 70);
    if (!H || H.ph !== "qw" || !text || this.qa?.rk !== H.rk || this.qa.a[i]) return;
    this.qa.a[i] = text; vibrate(25); this.push(); this.renderMain();
    const next = $(".qa-form input"); if (next) next.focus();
  },
  rVote(main) {
    const H = this.host, qv = H.qv || {}, a = Array.isArray(qv.a) ? qv.a.map(String) : [], me = fnv(this.pid + H.rk);
    // Which answer is this player's own: one hash per answer, or a list of them when several players wrote the same fake.
    const mine = (Array.isArray(qv.x) ? qv.x : []).findIndex(v => (Array.isArray(v) ? v.includes(me) : v === me));
    const tbar = `<div class="tbar" aria-hidden="true"><i id="tbar"></i></div>`, lash = H.kind === "lash" || H.kind === "bluff", bluff = H.kind === "bluff";
    if (!lash && mine >= 0) return paint(main, "qv-own|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">Your answer is up</p><p class="ph-big">Fingers crossed</p><p class="muted">You can't vote on your own matchup.</p></div>`);
    if (this.g?.rk === H.rk) return paint(main, "qv-lock|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">Voted for</p><p class="ph-h">${esc(a[this.g.i] || "")}</p><p class="muted">Waiting for everyone else.</p></div>`);
    paint(main, "qv|" + H.rk, `${tbar}<div class="card"><p class="eyebrow">${bluff ? "Bluff · which one is true?" : lash ? "Last Lash · pick the best" : "Pick the funnier one"}</p><p class="ph-q">${esc(qv.q || "")}</p>
      <div class="answers">${a.map((t, k) => (k === mine ? "" : `<button class="answer ${bluff ? "upper" : ""}" style="--oc:${OPT_COLORS[k % 4]}" data-act="qvote" data-i="${k}"><b>${lash ? k + 1 : LETTERS[k]}</b><span>${esc(t)}</span></button>`)).join("")}</div>
      ${lash && mine >= 0 ? `<p class="muted">${bluff ? "Your fake is hidden from you. Find the real one." : "Yours is on the TV too. No voting for yourself."}</p>` : ""}</div>`);
  },
  rQuipReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, pts = rv.d?.[me] || 0, lash = H.kind === "lash";
    const k = lash ? (rv.a || []).findIndex(x => x?.[0] === me) : (rv.by || []).indexOf(me), v = rv.v || [];

    const card = () => paint(main, "qz-rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p>${this.sipNote()}</div>`);
    if (H.qz.t === "num") {
      const show = v => (H.qz.y ? String(v) : fmt(v) + (H.qz.u ? " " + H.qz.u : ""));
      cls = pts ? "good" : mine === undefined ? "" : "bad";
      head = pts ? (mine === rv.n ? "Spot on!" : "Close!") : mine === undefined ? "Too slow" : "Not close enough";
      sub = `It's ${esc(show(rv.n))}.` + (pts ? ` +${fmt(pts)} points` : "");
      return card();
    }
    if (H.qz.t === "nhie" || H.qz.t === "wyr") {
      const n = rv.n || [0, 0];
      if (H.qz.t === "nhie") { head = mine === 0 ? "You have!" : mine === 1 ? "Never" : "No answer"; sub = `${n[0]} ${n[0] === 1 ? "has" : "have"}, ${n[1]} never.`; }
      else { cls = pts ? "good" : ""; head = mine === undefined ? "No vote" : rv.side < 0 ? "Split vote" : pts ? "With the room" : "Odd one out"; sub = pts ? `+${fmt(pts)} points` : `${n[0]} against ${n[1]}.`; }
      return card();
    }
    if (H.qz.t === "hot") {
      const name = esc(this.nameOf(rv.o)?.[1] || "They"), knew = Object.values(rv.g || {}).filter(i => i === rv.a).length, n = Object.keys(rv.g || {}).length;
      if (rv.o === this.pid) { cls = knew ? "good" : ""; head = rv.a < 0 ? "No answer" : knew === n && n ? "They know you!" : knew ? `${knew} of ${n} knew` : "Nobody knew"; sub = pts ? `+${fmt(pts)} points` : rv.a < 0 ? "You didn't answer, so nobody scored." : "No points this time."; return card(); }
      cls = rv.a < 0 ? "" : mine === rv.a ? "good" : "bad"; head = rv.a < 0 ? "No answer" : mine === rv.a ? "You know them!" : Number.isInteger(mine) ? "Not quite" : "Too slow";
      sub = rv.a < 0 ? `${name} didn't answer.` : (mine === rv.a ? `+${fmt(pts)} points. ` : "") + `${name} said “${right}”.`;
      return card();
    }
    if (H.qz.t === "ttl" && rv.o === this.pid) {
      const fooled = Object.values(rv.g || {}).filter(i => i !== rv.a).length;
      cls = fooled ? "good" : ""; head = fooled ? `You fooled ${fooled}!` : "They saw through you"; sub = pts ? `+${fmt(pts)} points` : "No points this time.";
      return card();
    }
    if (H.qz.t === "ttl") { cls = mine === rv.a ? "good" : Number.isInteger(mine) ? "bad" : ""; head = mine === rv.a ? "Spotted it!" : Number.isInteger(mine) ? "Fooled!" : "Too slow"; sub = (mine === rv.a ? `+${fmt(pts)} points. ` : "") + `The lie was “${right}”.`; return card(); }
    if (mine === rv.a) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (Number.isInteger(mine)) { cls = "bad"; head = "Nope"; sub = `It was ${right}.`; }
    else { head = "Too slow"; sub = `It was ${right}.`; }
    paint(main, "qz-rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p>${this.sipNote()}</div>`);
  },
  // The TV sends each phone its own secret word for an Imposter round.
  gotWord(d) {
    if (!d || typeof d.rk !== "string" || (d.w !== null && typeof d.w !== "string")) return;
    this.secret = { rk: d.rk, w: d.w ? cleanText(d.w, 40) : null, cat: cleanText(d.cat, 30), odd: !!d.odd };
    this.push(); this.renderMain(true);
  },
  wordBox() {
    const s = this.secret, H = this.host;
    if (!s || s.rk !== H.rk) return `<div class="card center"><p class="muted">Getting your word…</p></div>`;
    if (!(this.showWord > Date.now())) return `<button class="secret" data-act="peek"><span class="eyebrow">Your secret word</span><b>Tap to see it</b><span>Don't let anyone see your screen</span></button>`;
    return `<button class="secret on" data-act="peek"><span class="eyebrow">${esc(s.cat)}</span><b>${s.w ? esc(s.w) : "You're the imposter"}</b><span>${s.w ? "Hides again in a few seconds" : "You have no word. Listen to the clues and blend in."}</span></button>`;
  },
  rImp(main) {
    const H = this.host, sp = H.imp?.sp, mine = sp && sp === this.pid, spName = this.nameOf(sp)?.[1];
    const done = this.dn === H.rk + ":" + H.imp?.turn;
    let top;
    if (H.ph === "imp-word") top = `<p class="ph-h">Check your word</p><p class="muted">Everyone has the same word except one person. Keep it to yourself.</p>`;
    else if (H.ph === "imp-clue") top = mine
      ? `<p class="ph-big">Your turn!</p><p class="muted">Say one word about your word out loud, then tap Done.</p><button class="btn primary wide" data-act="clue-done" ${done ? "disabled" : ""}>${done ? "Done" : "Done, next person"}</button>`
      : `<p class="ph-h">${esc(spName || "Someone")} is giving a clue</p><p class="muted">Listen. Does it fit your word?</p>`;
    else {
      const ready = this.rd === H.rk;
      top = `<p class="ph-h">Who's the imposter?</p><p class="muted">Talk it over, no rush. Voting opens once everyone is ready.</p>
        <button class="btn primary wide" data-act="imp-ready" ${ready ? "disabled" : ""}>${ready ? "Ready. Waiting for the others" : "Ready to vote"}</button>`;
    }
    paint(main, ["imp", H.ph, H.rk, sp, done, this.rd === H.rk, this.secret?.rk, this.showWord > Date.now()].join("|"), `<div class="card ${mine ? "center" : ""}">${top}</div>${this.wordBox()}`);
  },
  rLikelyReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, tops = rv.top || [], pts = rv.d?.[me] || 0;
    const names = tops.map(id => this.nameOf(id)?.[1]).filter(Boolean).map(esc).join(" & ");
    const head = tops.includes(me) ? "That's you!" : pts ? "Same as the room" : rv.g?.[me] ? "Odd one out" : "No vote";
    const sub = (names ? `Most likely to ${esc(rv.lk || "")}: ${names}.` : "Nobody voted.") + (pts ? ` +${fmt(pts)} points` : "");
    paint(main, "lk-rev|" + H.rk, `<div class="card center result ${pts ? "good" : ""}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Most likely to</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p>${this.sipNote()}</div>`);
  },
  rMeldReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, x = (rv.gs || []).find(m => Array.isArray(m.by) && m.by.includes(me)), pts = rv.d?.[me] || 0;
    const k = x ? x.by.indexOf(me) : -1, said = x ? x.by.map((pid, j) => (j === k ? "" : `${esc(this.nameOf(pid)?.[1] || "?")}: “${esc(x.a[j] || "nothing")}”`)).filter(Boolean).join(" · ") : "";
    const head = !x ? "Mind meld" : pts ? "Mind meld!" : x.a[k] ? "No match" : "No answer";
    paint(main, "meld-rev|" + H.rk, `<div class="card center result ${pts ? "good" : x ? "bad" : ""}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Mind meld</p><p class="ph-big">${head}</p>
      <p style="font-weight:800;font-size:19px">${pts ? `+${fmt(pts)} points. ` : ""}${said || "Look at the TV."}</p>${this.sipNote()}</div>`);
  },
  rImpReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, imp = rv.o, pts = rv.d?.[me] || 0;
    const impName = esc(this.nameOf(imp)?.[1] || "Someone"), theirs = rv.x ? `“${esc(rv.x)}”` : "no word";
    let cls, head, sub;
    if (imp === me) { cls = rv.caught ? "bad" : "good"; head = rv.caught ? "You got caught" : "You got away!"; sub = `${rv.caught ? "" : `+${fmt(pts)} points. `}You had ${theirs}. Everyone else had “${esc(rv.w)}”.`; }
    else if (rv.g?.[me] === imp) { cls = "good"; head = "You spotted it!"; sub = `+${fmt(pts)} points. ${impName} had ${theirs}.`; }
    else { cls = "bad"; head = "Not quite"; sub = `It was ${impName}. They had ${theirs}; everyone else had “${esc(rv.w)}”.`; }
    const vip = H.vip === me, asked = this.cmd?.a === "next";
    paint(main, ["imp-rev", H.rk, vip, asked].join("|"), `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Imposter</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p>${this.sipNote()}</div>
      ${vip ? `<button class="btn primary wide" data-act="next-round" ${asked ? "disabled" : ""}>${asked ? "Moving on…" : "Next round"}</button>` : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start the next round.</p>`}`);
  },
  rReveal(main) {
    if (this.host.kind === "imp") return this.rImpReveal(main);
    if (this.host.kind === "quip" || this.host.kind === "lash" || this.host.kind === "bluff") return this.rQuipReveal(main);
    if (this.host.kind === "likely") return this.rLikelyReveal(main);
    if (this.host.kind === "meld") return this.rMeldReveal(main);
    if (this.host.qz && this.host.rv) return this.rQuizReveal(main);
    const H = this.host, rv = H.rv || { g: {}, d: {} }, ownerP = this.nameOf(rv.o);
    const pts = rv.d?.[this.pid] || 0, mine = rv.g?.[this.pid];
    let cls = "", head = "", sub = "";
    if (rv.o === this.pid) {
      const fooled = Object.values(rv.g || {}).filter(x => x !== rv.o).length;
      cls = fooled ? "good" : ""; head = fooled ? `You fooled ${fooled}!` : "Nobody fell for it";
      sub = pts ? `+${fmt(pts)} points` : "No points this time.";
    } else if (mine && mine === rv.o) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (mine) { cls = "bad"; head = "Nope"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    else { head = "Too slow"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    paint(main, "rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p>${this.sipNote()}</div>`);
  },
  rStandings(main) {
    const H = this.host, ps = this.pl().slice().sort((a, b) => b[3] - a[3]), me = this.me();
    const rank = me ? 1 + ps.filter(p => p[3] > me[3]).length : 0;
    const end = H.ph === "end", vip = H.vip === this.pid;
    paint(main, [H.ph, H.rk, H.gid, me?.[3], vip, !!this.cmd, JSON.stringify(H.aw || null), H.dare?.pid, H.dare?.t].join("|"), `<div class="card center result ${end && rank === 1 ? "good" : ""}">
        <p class="eyebrow">${end ? "Final scores" : "Scores so far"}</p>
        <p class="ph-big">${me ? (end && rank === 1 ? "You win!" : ordinal(rank) + " place") : "Next game"}</p>
        ${me ? `<p style="font-weight:800;font-size:20px" class="num">${fmt(me[3])} points</p>` : ""}
        ${!end && H.dare?.pid === this.pid ? `<p class="eyebrow" style="margin-top:8px">A dare for you</p><p style="font-weight:800">${esc(cleanText(H.dare.t, 120))} Or pass, no shame.</p>` : ""}
        ${end ? (H.aw || []).filter(a => a[0] === this.pid).map(a => `<p class="eyebrow">Award: ${esc(a[1])}</p><p class="muted">${esc(a[2])}</p>`).join("") : ""}
      </div>
      ${end ? (vip ? `<button class="btn primary wide" data-act="again" ${this.cmd ? "disabled" : ""}>${this.cmd ? "Starting…" : "Play again"}</button>${(H.modes || []).includes("photo") ? `<p class="muted" style="text-align:center">Everyone picks new photos for the next game.</p>` : ""}`
        : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start another game.</p>`) : ""}`);
  },
  renderClock() {
    const bar = $("#tbar"), H = this.host;
    if (!bar || !H || !["q", "qw", "qv"].includes(H.ph) || H.kind === "imp" || H.pause) return;
    const total = H.ph === "qw" ? QW_SECS[H.kind] || Q_SECS : H.ph === "qv" ? QV_SECS[H.kind] || Q_SECS : Q_SECS;
    const left = Math.max(0, (this.deadline - Date.now()) / 1000);
    bar.style.width = Math.min(100, left / total * 100).toFixed(1) + "%";
  },
};

// ---------- events ----------
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "go-tv") return TV.start();
  if (a === "go-phone") return PH.start();
  if (mode === "tv") TV.act(a, b);
  else if (mode === "phone") { if (a === "join") e.preventDefault(); PH.act(a, b); }
});
app.addEventListener("change", e => {
  if (mode !== "tv") return;
  if (e.target.id === "tune-sel") TV.setTune(e.target.value, e.target.selectedOptions[0]?.textContent);
  if (e.target.id === "face-sel") TV.setFaceCat(e.target.value);
  if (e.target.id === "theme-sel") TV.setTheme(e.target.value);
  if (e.target.id === "len-sel") TV.setLen(e.target.value);
  if (e.target.id === "imp-sel") TV.setImpVar(e.target.value);
  if (e.target.id === "snd-sel") TV.setSnd(e.target.value);
  if (e.target.id === "anon-sel") TV.setAnon(e.target.value);
  if (e.target.id === "host-sel") TV.setHost(e.target.value);
  if (e.target.id === "spicy-sel") TV.setSpicy(e.target.value);
  if (e.target.id === "drinks-sel") TV.setDrinks(e.target.value);
  if (e.target.id === "diff-sel") TV.setDiff(e.target.value);
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (mode === "tv" && e.target.id === "tune-form") return TV.setTune($("#tune-in")?.value, null);
  if (mode === "phone" && e.target.id === "song-form") return PH.searchSongs();
  if (mode === "phone" && e.target.classList.contains("qa-form")) return PH.sendQuip(Number(e.target.dataset.i));
  if (mode === "phone" && e.target.classList.contains("ttl-form")) return PH.sendTtl(!!e.submitter);
  if (mode === "phone" && e.target.classList.contains("num-form")) return PH.sendNum();
  if (mode === "phone") PH.act("join");
});
$("#selfie-in").addEventListener("change", e => { const f = e.target.files?.[0]; if (f && mode === "phone") PH.setSelfie(f); });
fileIn.addEventListener("change", () => {
  const files = Array.from(fileIn.files || []);
  if (!files.length) return;
  if (mode === "tv") TV.addPhotos(files); else if (mode === "phone") PH.addPhotos(files);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode) wake(); });
// A new room code after the # (another QR code opened in the same tab) starts the page fresh.
addEventListener("hashchange", () => location.reload());

// Any picture that fails to load switches to its fallback (data-alt) when it has one.
document.addEventListener("error", e => {
  const im = e.target;
  if (im?.tagName === "IMG" && im.classList.contains("av-img")) return im.remove();
  if (im?.tagName === "IMG" && im.dataset.alt && im.src !== im.dataset.alt) { const alt = im.dataset.alt; im.dataset.alt = ""; im.src = alt; }
}, true);

// ---------- boot ----------
const last = store.get("wiw.mode");
if (location.pathname === "/tv") TV.start();
else if (hashCode) PH.start();
else if (last && Date.now() - (last.at || 0) < 4 * 3600e3 && (last.m === "tv" || last.m === "phone")) (last.m === "tv" ? TV : PH).start();
else renderLanding();
})();
</script>
</body>
