      paint(stage, "q|" + H.rk, `<section class="tgrid"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Higher or lower · ${esc(cur.cat)}${final ? " · Double points" : ""}</p>
        ${this.hiloPair(cur, false)}<h2 class="tqt">${esc(cur.o[0])} or ${esc(cur.o[1].toLowerCase())}?</h2><ol class="opts two">${this.optsHtml(cur)}</ol>${foot}</section>`);
      return this.renderLocks(null);
    }
    if (cur.t === "hot") {
      const sp = H.players[cur.pid];
      paint(stage, "q|" + H.rk, `<section class="tgrid"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Hot seat${final ? " · Double points" : ""}</p>
        <div class="speaker">${sp ? face(sp) : ""}<div><p class="eyebrow">${esc(sp?.name || "Someone")} is in the hot seat</p><h2 class="tqt">${esc(askOf(cur))}</h2></div></div>
        <ol class="opts four">${this.optsHtml(cur)}</ol>${foot}</section>`);
      return this.renderLocks(null);
    }
    if (cur.t === "ttl") {
      const sp = H.players[cur.pid];
      paint(stage, "q|" + H.rk, `<section class="tgrid"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Two truths and a lie · ${cur.mi + 1} of ${cur.ord.length}${final ? " · Double points" : ""}</p>
        <div class="speaker">${sp ? face(sp) : ""}<h2 class="tqt">${esc(askOf(cur))}</h2></div><ol class="opts wrap">${this.optsHtml(cur)}</ol>${foot}</section>`);
      return this.renderLocks(this.curOwner());
    }
    // Text rounds: the question across the screen with the answers under it.
    if (TEXT_KINDS.includes(cur.t)) {
      const label = cur.t === "trivia" ? "Trivia · " + esc(cur.cat) : cur.t === "buzz" ? "Buzzer · First right answer wins · " + esc(cur.cat) : MODE_LABEL[cur.t];
      const body = NUM_KINDS.includes(cur.t) ? `<p class="lede">${cur.t === "year" ? "Type the year on your phone. Closest wins." : "Type your best guess on your phone. Closest wins."}</p>` : `<ol class="opts ${cur.o.length > 2 ? "four" : "two"}">${this.optsHtml(cur)}</ol>`;
      paint(stage, "q|" + H.rk, `<section class="tgrid"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · ${label}${final ? " · Double points" : ""}</p>
        <h2 class="tqt">${esc(askOf(cur))}</h2>${body}${foot}</section>`);
      return this.renderLocks(null);
    }
    paint(stage, "q|" + H.rk + "|" + (DATA.shapes ? 1 : 0), `<section class="qgrid">
      <div class="qphoto">${this.quizMedia(cur)}</div>
      <div class="qside quiz">
        <p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · ${MODE_LABEL[cur.t]}${this.musicTag(cur)}${final ? " · Double points" : ""}</p>
        <h2 class="qtitle">${esc(askOf(cur))}</h2>
        <ol class="opts">${this.optsHtml(cur)}</ol>
        <div class="qfoot"><div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>
          <div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div></div>
      </div></section>`);
    this.renderLocks(null);
  },
  quizRevealHtml() {
    const H = this.H, cur = H.cur, rv = H.rv || { a: cur.a, g: {}, d: {} }, P = H.players;
    const nv = Object.keys(rv.g).length, t = 1.2 + nv * 0.18, loc = cur.t === "flag" || cur.t === "map" ? locatorSvg(cur.id) : "";
    const right = Object.values(rv.g).filter(i => i === rv.a).length;
    const deltas = this.scorersHtml(rv, right ? `${right} ${right === 1 ? "person" : "people"} got it right` : "", "Nobody got it right");
    if (NUM_KINDS.includes(cur.t)) return this.numRevealHtml();
    if (cur.t === "hilo") return `<section class="tgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s"><p class="eyebrow">Higher or lower · ${esc(cur.cat)}${rv.m > 1 ? " · Double points" : ""}</p>
      ${this.hiloPair(cur, true)}<ol class="opts two">${this.optsHtml(cur, rv)}</ol><div class="deltas">${deltas || `<span class="delta">Nobody scored this round</span>`}${this.sipHtml()}</div></section>`;
    if (cur.t === "hot") {
      const sp = P[rv.o], name = esc(sp?.name || "They");
      const line = rv.a < 0 ? `<span class="delta">${name} didn't answer, so nobody scores</span>` : this.scorersHtml(rv, right ? `${right} ${right === 1 ? "person" : "people"} knew` : "", "Nobody knew");
      return `<section class="tgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s"><p class="eyebrow">Hot seat${rv.m > 1 ? " · Double points" : ""}</p>
        <div class="speaker">${sp ? face(sp) : ""}<h2 class="tqt">${esc(askOf(cur))}</h2></div><ol class="opts four">${this.optsHtml(cur, rv)}</ol>
        <div class="deltas">${line}${this.sipHtml()}</div></section>`;
    }
    if (cur.t === "ttl") {
      const sp = P[rv.o];
      return `<section class="tgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s"><p class="eyebrow">Two truths and a lie${rv.m > 1 ? " · Double points" : ""}</p>
        <div class="speaker">${sp ? face(sp) : ""}<h2 class="tqt">The lie was ${LETTERS[rv.a]}</h2></div><ol class="opts wrap">${this.optsHtml(cur, rv)}</ol>
        <div class="deltas">${this.scorersHtml(rv, right ? `${right} ${right === 1 ? "person" : "people"} spotted it` : "", "Nobody scored")}${this.sipHtml()}</div></section>`;
    }
    if (TEXT_KINDS.includes(cur.t)) {
      const n = rv.n || [0, 0];
      const wrong = Object.keys(rv.d || {}).filter(id => rv.d[id] < 0 && P[id]);
      const line = cur.t === "buzz" ? (rv.first && P[rv.first] ? `<span class="delta">${face(P[rv.first])}${esc(P[rv.first].name)} buzzed first <b class="num">+${fmt(rv.d[rv.first])}</b></span>` : `<span class="delta">Nobody got it</span>`)
          + (wrong.length ? `<span class="delta sip">Wrong buzz, ${fmt(-rv.d[wrong[0]])} off: ${wrong.map(id => esc(P[id].name)).join(", ")}</span>` : "")
        : cur.t === "nhie" ? `<span class="delta">${n[0]} ${n[0] === 1 ? "has" : "have"} · ${n[1]} never</span>`
        : cur.t === "wyr" ? this.scorersHtml(rv, rv.side >= 0 ? "Most of the room agreed" : "", "Split vote, no points") : deltas;
      return `<section class="tgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s"><p class="eyebrow">${cur.t === "trivia" ? esc(cur.cat) : MODE_LABEL[cur.t]}${rv.m > 1 ? " · Double points" : ""}</p>
        <h2 class="tqt">${esc(askOf(cur))}</h2><ol class="opts ${cur.o.length > 2 ? "four" : "two"}">${this.optsHtml(cur, rv)}</ol>
        ${cur.t === "odd" ? `<p class="who-d">${esc(cur.why)}</p>` : ""}<div class="deltas">${line}${this.sipHtml()}</div></section>`;
    }
    return `<section class="rgrid" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto">${this.quizMedia(cur, true)}<div class="stamp low ${cur.o[rv.a].length > 14 ? "long" : ""}">${esc(cur.o[rv.a])}</div></div>
      <div class="rside">
        <p class="eyebrow">${nv ? "Votes" : "Nobody locked in an answer"}${rv.m > 1 ? " · Double points" : ""}</p>
        <ol class="opts">${this.optsHtml(cur, rv)}</ol>
        <div class="deltas">${deltas || `<span class="delta">Nobody scored this round</span>`}${this.sipHtml()}</div>
        ${cur.t === "face" ? `<p class="who-d">${esc(cur.d)}</p><p class="credit">Photo: ${esc(cur.src || "Wikipedia")}</p>` : ""}
        ${cur.t === "tune" ? `<p class="who-d">${esc(cur.title)} · ${esc(cur.artist)}</p>` : ""}
        ${cur.t === "cap" ? `<p class="who-d">The capital of ${esc(cur.cn)} is ${esc(cur.o[rv.a])}.</p>` : ""}
        ${cur.t === "big" ? `<p class="who-d">${esc(cur.o[0])}: ${fmt(cur.ar[0])} km² · ${esc(cur.o[1])}: ${fmt(cur.ar[1])} km²</p>` : ""}
        ${loc ? `<div class="loc">${loc}</div>` : ""}
      </div></section>`;
  },
  numRevealHtml() {
    const H = this.H, cur = H.cur, rv = H.rv || { g: {}, d: {}, n: cur.n }, P = H.players;
    const show = v => (cur.y ? String(v) : fmt(v) + (cur.u ? " " + cur.u : ""));
    const rows = Object.entries(rv.g).filter(([id]) => P[id]).map(([id, v]) => ({ id, v, off: Math.abs(v - rv.n) })).sort((a, b) => a.off - b.off);
    return `<section class="tgrid"><p class="eyebrow">${MODE_LABEL[cur.t]}${rv.m > 1 ? " · Double points" : ""}</p><h2 class="tqt">${esc(cur.q)}</h2>
      <div class="numans"><span class="eyebrow">The answer</span><b class="num">${esc(show(rv.n))}</b></div>
      <ol class="lash">${rows.map((r, i) => `<li class="${i === 0 ? "win" : ""}" style="animation-delay:${(0.5 + i * 0.12).toFixed(2)}s">${face(P[r.id])}<span>${esc(P[r.id].name)} · ${esc(show(r.v))}</span>
        <b class="num">${rv.d[r.id] ? "+" + fmt(rv.d[r.id]) : "off by " + esc(cur.y ? String(r.off) : fmt(r.off))}</b></li>`).join("")}</ol>
      <div class="deltas">${rows.length ? "" : `<span class="delta">Nobody guessed</span>`}${this.sipHtml()}</div></section>`;
  },
  bluffRevealHtml() {
    const H = this.H, rv = H.rv, P = H.players, votes = this.votesBy(rv.g);
    const rows = rv.opts.map((o, k) => ({ ...o, k })).sort((a, b) => (b.tr - a.tr) || (votes[b.k]?.length || 0) - (votes[a.k]?.length || 0));
    return `<section class="tgrid"><p class="eyebrow">Bluff${rv.m > 1 ? " · Double points" : ""}</p><h2 class="tqt">${esc(rv.q)}</h2>
      <ol class="lash bluff">${rows.map((r, i) => `<li class="${r.tr ? "win" : ""}" style="animation-delay:${(i * 0.15).toFixed(2)}s">${r.tr ? "<b>✓</b>" : r.by.filter(id => P[id]).map(id => face(P[id])).join("")}
        <span>${esc(r.t)}${r.tr ? " <i>the truth</i>" : ""}</span>${this.votersHtml(votes[r.k] || [], i)}</li>`).join("")}</ol>
      <div class="deltas">${this.scorersHtml(rv, "", "Nobody scored")}${this.sipHtml()}</div></section>`;
  },
  clockHtml() { return `<div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>`; },
  renderWrite(stage) {
    const H = this.H, cur = H.cur, lash = cur.t === "lash", bluff = cur.t === "bluff", said = cur.t === "said", final = H.R > 1 && H.r === H.R;
    paint(stage, "qw|" + H.rk, `<section class="imp"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · ${MODE_LABEL[cur.t]}${final ? " · Double points" : ""}</p>
      <h2 class="qtitle">${lash || bluff || said ? esc(cur.q) : cur.t === "ttl" ? "Two truths and a lie" : cur.t === "meld" ? "Mind meld" : "Write something funny"}</h2>
      <p class="lede">${bluff ? "Fill in the blank with a fake answer that sounds true. Then everyone tries to spot the real one among the fakes."
        : cur.t === "meld" ? "You're in pairs, and each pair has the same prompt. Type the answer you think your partner will type. No talking! Match and you both score 1,000."
        : cur.t === "ttl" ? "Everyone types two true things about themselves and one believable lie. Then the TV mixes them up and the room tries to spot each player's lie."
        : said ? "Everyone answers on their phone, honestly. Then each answer goes up here and the room guesses who wrote it. Fool them and you score."
        : lash ? "Everyone answers this one on their phone. Then you all vote for the best." : "Everyone has two prompts on their phone. Each prompt goes to two of you, and the room votes for the funnier answer."}</p>
      ${cur.t === "meld" ? `<ul class="meldpairs" id="meld-pairs"></ul>` : ""}
      <div class="qfoot">${this.clockHtml()}<div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div></div></section>`);
    const ps = this.players().filter(p => p.online), done = ps.filter(p => this.writesFor(p.pid).every(i => cur.ans[i]?.[p.pid]));
    if (cur.t === "meld") paint($("#meld-pairs"), cur.ps.map(m => m.by.join()).join("|"), cur.ps.map(m => `<li>${m.by.map(pid => H.players[pid] ? face(H.players[pid]) : "").join("")}<span>${esc(m.by.map(pid => H.players[pid]?.name || "?").join(" + "))}</span><b>${esc(m.q)}</b></li>`).join(""));
    paint($("#lockcount"), `${done.length}/${ps.length}`, `Finished <span class="num">${done.length} of ${ps.length}</span>`);
    paint($("#locks"), ps.map(p => p.pid + done.includes(p)).join() + H.anon, ps.map(p => H.anon ? `<li class="dot ${done.includes(p) ? "in" : ""}"></li>` : `<li class="lock ${done.includes(p) ? "in" : ""}">${face(p)}<span>${esc(p.name)}</span></li>`).join(""));
  },
  renderVote(stage) {
    const H = this.H, cur = H.cur, foot = `<div class="qfoot">${this.clockHtml()}<div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div></div>`;
    if (cur.t === "bluff") {
      paint(stage, "qv|" + H.rk, `<section class="tgrid"><p class="eyebrow">Bluff · Which one is true? Pick on your phone</p><h2 class="tqt">${esc(cur.q)}</h2>
        <ol class="lash bluff">${cur.opts.map((o, k) => `<li style="animation-delay:${(k * 0.12).toFixed(2)}s"><b>${k + 1}</b><span>${esc(o.t)}</span></li>`).join("")}</ol>${foot}</section>`);
      return this.renderLocks(null);
    }
    if (cur.t === "lash") {
      paint(stage, "qv|" + H.rk, `<section class="tgrid"><p class="eyebrow">Last Lash · Vote for the best on your phone</p><h2 class="tqt">${esc(cur.q)}</h2>
        <ol class="lash">${cur.ord.map((pid, k) => `<li style="animation-delay:${(k * 0.12).toFixed(2)}s"><b>${k + 1}</b><span>${esc(cur.ans[0][pid])}</span></li>`).join("")}</ol>${foot}</section>`);
      return this.renderLocks(null);
    }
    const m = cur.ps[cur.mi], ans = cur.ans[cur.mi] || {};
    paint(stage, "qv|" + H.rk, `<section class="tgrid"><p class="eyebrow">Quips · ${cur.mi + 1} of ${cur.ps.length} · Vote on your phone</p><h2 class="tqt">${esc(m.q)}</h2>
      <div class="quips">${m.by.map((pid, k) => `<div class="quipcard" style="--oc:${OPT_COLORS[k]}"><b>${LETTERS[k]}</b><p>${esc(ans[pid] || "")}</p></div>`).join("")}</div>${foot}</section>`);
    this.renderLocks(m.by);
  },
  meldRevealHtml() {
    const H = this.H, rv = H.rv, P = H.players, n = Object.keys(rv.d || {}).length;
    const cards = (rv.gs || []).map((x, i) => `<li class="meldcard ${x.hit.some(Boolean) ? "win" : ""}" style="animation-delay:${(i * 0.18).toFixed(2)}s"><p class="eyebrow">${esc(x.q)}</p>
      ${x.by.map((pid, k) => `<div class="mrow">${P[pid] ? face(P[pid]) : ""}<span>${x.a[k] ? esc(x.a[k]) : "<i>No answer</i>"}</span>${x.hit[k] ? `<b class="num">+${fmt(rv.d[pid] || 0)}</b>` : ""}</div>`).join("")}</li>`).join("");
    return `<section class="tgrid"><p class="eyebrow">Mind meld${rv.m > 1 ? " · Double points" : ""}</p><h2 class="tqt">${n ? "Great minds!" : "Not a single match"}</h2>
      <ul class="meldgrid">${cards}</ul><div class="deltas">${n ? `<span class="delta">${n} ${n === 1 ? "player" : "players"} in sync</span>` : ""}${this.sipHtml()}</div></section>`;
  },
  quipRevealHtml() {
    const H = this.H, rv = H.rv, P = H.players, votes = this.votesBy(rv.g), t = 1.6;
    const cards = [0, 1].map(k => {
      const pid = rv.by[k], p = P[pid], win = rv.a[k] && (rv.v[k] > rv.v[1 - k] || !rv.a[1 - k]);
      return `<div class="quipcard ${win ? "win" : ""}" style="--oc:${OPT_COLORS[k]}"><b>${LETTERS[k]}</b><p>${rv.a[k] ? esc(rv.a[k]) : "<i>No answer</i>"}</p>
        <div class="by">${p ? face(p) + `<span>${esc(p.name)}</span>` : ""}${rv.d[pid] ? `<b class="num">+${fmt(rv.d[pid])}</b>` : ""}</div>${this.votersHtml(votes[k] || [], k)}</div>`;
    }).join("");
    return `<section class="tgrid" style="--t:${t}s;--t2:${t + 0.8}s"><p class="eyebrow">Quips · ${rv.mi + 1} of ${rv.n}${rv.m > 1 ? " · Double points" : ""}</p><h2 class="tqt">${esc(rv.q)}</h2>
      <div class="quips">${cards}</div>${rv.sweep ? `<div class="stamp low">Landslide!</div>` : ""}<div class="deltas">${this.sipHtml()}</div></section>`;
  },
  lashRevealHtml() {
    const H = this.H, rv = H.rv, P = H.players, votes = this.votesBy(rv.g);
    const rows = rv.a.map(([pid, text], k) => ({ pid, text, k, v: rv.v[k] })).sort((a, b) => b.v - a.v);
    return `<section class="tgrid"><p class="eyebrow">Last Lash${rv.m > 1 ? " · Double points" : ""}</p><h2 class="tqt">${esc(rv.q)}</h2>
      <ol class="lash">${rows.map((r, i) => `<li class="${r.pid === rv.best ? "win" : ""}" style="animation-delay:${(i * 0.15).toFixed(2)}s">${P[r.pid] ? face(P[r.pid]) : ""}<span>${esc(r.text)}</span>${this.votersHtml(votes[r.k] || [], i)}${rv.d[r.pid] ? `<b class="num">+${fmt(rv.d[r.pid])}</b>` : ""}</li>`).join("")}</ol>
      <div class="deltas">${this.sipHtml()}</div></section>`;
  },
  renderLikely(stage) {
    const H = this.H, final = H.R > 1 && H.r === H.R;
    paint(stage, "lq|" + H.rk, `<section class="imp"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Most likely to${final ? " · Double points" : ""}</p>
      <h2 class="qtitle likely">Who's most likely to ${esc(H.cur.lk)}?</h2>
      <p class="lede">Vote on your phone. You score if you pick the same person as most of the room.</p>
      <div class="qfoot"><div class="clock" id="clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="40" pathLength="100"/></svg><span id="clock-n" class="num"></span></div>
        <div><p class="eyebrow" id="lockcount"></p><ul class="locks" id="locks"></ul></div></div></section>`);
    this.renderLocks(null);
  },
  likelyRevealHtml() {
    const H = this.H, rv = H.rv || { g: {}, d: {} }, P = H.players, tops = (rv.top || []).filter(id => P[id]);
    const votes = this.votesBy(rv.g);
    const rows = Object.keys(votes).filter(id => P[id]).sort((a, b) => votes[b].length - votes[a].length);
    const t = 1.4 + rows.length * 0.25, sided = Object.keys(rv.d || {}).length, lead = tops.length === 1 ? P[tops[0]] : null;
    const rowHtml = rows.map((id, i) => `<li class="${tops.includes(id) ? "win" : ""}">${face(P[id])}<span class="nm">${esc(P[id].name)}</span>${this.votersHtml(votes[id], i)}</li>`).join("");
    return `<section class="rgrid impr" style="--t:${t.toFixed(2)}s;--t2:${(t + 0.8).toFixed(2)}s">
      <div class="qphoto bigav"><p class="eyebrow">Most likely to ${esc(rv.lk || H.cur.lk)}</p>${lead ? face(lead) : ""}${rows.length ? `<div class="stamp low">${lead ? esc(lead.name) + "!" : tops.length ? "It's a tie!" : "Split vote!"}</div>` : ""}</div>
      <div class="rside"><p class="eyebrow">${rows.length ? "Votes" : "Nobody voted"}${rv.m > 1 ? " · Double points" : ""}</p><ul class="rows">${rowHtml}</ul>
        <div class="deltas">${this.scorersHtml(rv, sided ? `${sided} ${sided === 1 ? "person" : "people"} sided with the room` : "", "Nobody scored this round")}${this.sipHtml()}</div></div></section>`;
  },
  // Shot in the dark while people pick: the empty grid, who's still in, the ghosts, the clock.
  renderShot(stage) {
    const H = this.H, c = H.cur, P = H.players, final = H.R > 1 && H.r === H.R;
    const faces = ids => ids.filter(id => P[id]).map(id => `<li class="${H.guesses[id] ? "in" : ""}">${face(P[id])}<span>${esc(P[id].name)}</span></li>`).join("");
    paint(stage, ["sq", H.rk, Object.keys(H.guesses).join()].join("|"), `<section class="shot"><div class="sgrid s${c.size}">${Array.from({ length: c.size * c.size }, (_, k) => `<div class="sq" style="--i:${k}"><b class="num">${k + 1}</b></div>`).join("")}</div>
      <div class="sside"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Shot in the dark · Volley ${c.v + 1} of ${c.n}${final ? " · Double points" : ""}</p>
        <h2 class="qtitle">Hide, then shoot</h2>
        <p class="lede">On your phone, pick a square to hide in and one to shoot. All the shots land at once. ${c.ghosts.length ? "Ghosts can still shoot." : ""}</p>

  // The volley: everyone appears where they hid, the shots land, and whoever was hit is out.

  renderClock() {
    const H = this.H;
    if (H.ph !== "q" && H.ph !== "qw" && H.ph !== "qv" && H.ph !== "dw" && !SECRET_PHASES.includes(H.ph)) return;

    const k = Math.ceil(left);

  },
};

// =====================================================================
// Phone: a controller. Reads the TV's presence, publishes its own.
// =====================================================================
const PH = {
  pid: "", name: "", code: null, joined: false, photos: [], songs: [], search: null, playing: null, audio: null, host: null, hosts: [], uploading: null, g: null, cmd: null, deadline: 0, connected: false, confirmLeave: 0,

  // A photo is { id, b64, gid, up, prog, retryAt }. `up` means the server has it; `gid` is the game the TV used it in.
  start() {
    mode = "phone"; store.set("wiw.mode", { m: "phone", at: Date.now() });
    const s = store.get("wiw.phone") || {};

      cls = fooled ? "good" : ""; head = fooled ? `You fooled ${fooled}!` : "They saw through you"; sub = pts ? `+${fmt(pts)} points` : "No points this time.";
      return card();
    }
    if (H.qz.t === "ttl") { cls = mine === rv.a ? "good" : Number.isInteger(mine) ? "bad" : ""; head = mine === rv.a ? "Spotted it!" : Number.isInteger(mine) ? "Fooled!" : "Too slow"; sub = (mine === rv.a ? `+${fmt(pts)} points. ` : "") + `The lie was “${right}”.`; return card(); }
    if (mine === rv.a) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (Number.isInteger(mine)) { cls = "bad"; head = "Nope"; sub = `It was ${right}.`; }
    else { head = "Too slow"; sub = `It was ${right}.`; }
    if (Array.isArray(H.qz.hv)) sub += ` ${esc(H.qz.hv[0])}: ${esc(H.qz.hv[1])}.`;
    paint(main, "qz-rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p>${this.sipNote()}</div>`);
  },
  // The TV sends each phone its own secret word for an Imposter round.
  gotWord(d) {
    if (!d || typeof d.rk !== "string" || (d.w !== null && typeof d.w !== "string")) return;
    this.secret = { rk: d.rk, w: d.w ? cleanText(d.w, 40) : null, cat: cleanText(d.cat, 30), odd: !!d.odd };
    this.push(); this.renderMain(true);
  },
  wordBox() {
    const s = this.secret, H = this.host;
    if (!s || s.rk !== H.rk) return `<div class="card center"><p class="muted">Getting your word…</p></div>`;
    if (!(this.showWord > Date.now())) return `<button class="secret" data-act="peek"><span class="eyebrow">Your secret word</span><b>Tap to see it</b><span>Don't let anyone see your screen</span></button>`;
    return `<button class="secret on" data-act="peek"><span class="eyebrow">${esc(s.cat)}</span><b>${s.w ? esc(s.w) : "You're the imposter"}</b><span>${s.w ? "Hides again in a few seconds" : "You have no word. Listen to the clues and blend in."}</span></button>`;
  },
  rImp(main) {
    const H = this.host, sp = H.imp?.sp, mine = sp && sp === this.pid, spName = this.nameOf(sp)?.[1];
    const done = this.dn === H.rk + ":" + H.imp?.turn;
    let top;
    if (H.ph === "imp-word") top = `<p class="ph-h">Check your word</p><p class="muted">Everyone has the same word except one person. Keep it to yourself.</p>`;
    else if (H.ph === "imp-clue") top = mine
      ? `<p class="ph-big">Your turn!</p><p class="muted">Say one word about your word out loud, then tap Done.</p><button class="btn primary wide" data-act="clue-done" ${done ? "disabled" : ""}>${done ? "Done" : "Done, next person"}</button>`
      : `<p class="ph-h">${esc(spName || "Someone")} is giving a clue</p><p class="muted">Listen. Does it fit your word?</p>`;
    else {
      const ready = this.rd === H.rk;
      top = `<p class="ph-h">Who's the imposter?</p><p class="muted">Talk it over, no rush. Voting opens once everyone is ready.</p>
        <button class="btn primary wide" data-act="imp-ready" ${ready ? "disabled" : ""}>${ready ? "Ready. Waiting for the others" : "Ready to vote"}</button>`;
    }
    paint(main, ["imp", H.ph, H.rk, sp, done, this.rd === H.rk, this.secret?.rk, this.showWord > Date.now()].join("|"), `<div class="card ${mine ? "center" : ""}">${top}</div>${this.wordBox()}`);
  },
  // Fakin' it: the TV whispers each phone its question; the faker's is different.
  gotFk(d) {
    if (typeof d.rk !== "string" || typeof d.fq !== "string" || !["who", "num", "yn"].includes(d.t)) return;
    this.fkq = { rk: d.rk, q: cleanText(d.fq, 120), t: d.t };
    this.push(); this.renderMain(true);
  },
  sendFkNum() {
    const H = this.host, raw = String($("#fk-num")?.value || "").replace(/[\s,]/g, ""), v = Number(raw);
    if (H?.ph !== "fk-ans" || this.fkq?.rk !== H.rk || !raw || !Number.isFinite(v) || this.g?.rk === H.rk) return;
    this.g = { rk: H.rk, v }; vibrate(30); this.push(); this.renderMain();
  },
  rFakin(main) {
    const H = this.host, f = this.fkq, tbar = `<div class="tbar" aria-hidden="true"><i id="tbar"></i></div>`;
    if (H.ph === "fk-talk") {
      const ready = this.rd === H.rk;
      return paint(main, ["fkt", H.rk, ready].join("|"), `<div class="card"><p class="eyebrow">Fakin' it</p><p class="ph-h">Whose answer doesn't fit?</p>
        <p class="muted">The real question is on the TV. One of you was answering something else. Talk it over, no rush.</p>
        <button class="btn primary wide" data-act="fk-ready" ${ready ? "disabled" : ""}>${ready ? "Ready. Waiting for the others" : "Ready to vote"}</button></div>`);
    }
    if (!f || f.rk !== H.rk) return paint(main, "fk-wait|" + H.rk, `${tbar}<div class="card center"><p class="muted">Getting your question…</p></div>`);
    const mine = this.g?.rk === H.rk ? this.g : null;
    if (mine) {
      const shown = f.t === "who" ? esc(this.nameOf(mine.p)?.[1] || "?") + (mine.p === this.pid ? " (you)" : "") : f.t === "yn" ? (mine.i ? "No" : "Yes") : esc(fmt(mine.v));
      return paint(main, "fk-lock|" + H.rk, `${tbar}<div class="card center result"><p class="eyebrow">Your answer</p><p class="ph-big">${shown}</p><p class="muted">${esc(f.q)}</p><p class="muted">Keep it to yourself. Waiting for everyone else.</p></div>`);
    }
    const head = `<p class="eyebrow">Fakin' it · Your question</p><p class="ph-h" style="font-size:24px">${esc(f.q)}</p><p class="muted">Don't say it out loud. One person has a different question.</p>`;
    const here = this.pl().filter(p => p[4] || p[0] === this.pid);
    if (f.t === "who") return paint(main, "fk|" + H.rk + "|" + here.map(p => p[0]).join(), `${tbar}<div class="card">${head}
      <div class="choices">${here.map(p => `<button class="choice" data-act="fk-who" data-pid="${p[0]}">${faceA(p)}<span>${p[0] === this.pid ? "Me" : esc(p[1])}</span></button>`).join("")}</div></div>`);
    if (f.t === "yn") return paint(main, "fk|" + H.rk, `${tbar}<div class="card">${head}<div class="answers">${["Yes", "No"].map((t, i) => `<button class="answer" style="--oc:${OPT_COLORS[i]}" data-act="fk-yn" data-i="${i}"><b>${LETTERS[i]}</b><span>${t}</span></button>`).join("")}</div></div>`);
    paint(main, "fk|" + H.rk, `${tbar}<form class="card fk-num-form" novalidate>${head}<div class="field"><label for="fk-num">Your number</label><input id="fk-num" inputmode="decimal" autocomplete="off" enterkeyhint="send"></div><button class="btn primary wide" type="submit">Lock in</button></form>`);
  },
  rFakinReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, imp = rv.o, pts = rv.d?.[me] || 0, impName = esc(this.nameOf(imp)?.[1] || "Someone");
    let cls, head, sub;
    if (imp === me) { cls = rv.caught ? "bad" : "good"; head = rv.caught ? "You got caught" : "You got away!"; sub = `${rv.caught ? "" : `+${fmt(pts)} points. `}You had “${esc(rv.x)}”.`; }
    else if (rv.g?.[me] === imp) { cls = "good"; head = "You spotted them!"; sub = `+${fmt(pts)} points. ${impName} had “${esc(rv.x)}”.`; }
    else { cls = "bad"; head = "Not quite"; sub = `It was ${impName}. They had “${esc(rv.x)}”.`; }
    paint(main, "fk-rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Fakin' it</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p>${this.sipNote()}</div>`);
  },
  rLikelyReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, tops = rv.top || [], pts = rv.d?.[me] || 0;
    const names = tops.map(id => this.nameOf(id)?.[1]).filter(Boolean).map(esc).join(" & ");
    const head = tops.includes(me) ? "That's you!" : pts ? "Same as the room" : rv.g?.[me] ? "Odd one out" : "No vote";
    const sub = (names ? `Most likely to ${esc(rv.lk || "")}: ${names}.` : "Nobody voted.") + (pts ? ` +${fmt(pts)} points` : "");
    paint(main, "lk-rev|" + H.rk, `<div class="card center result ${pts ? "good" : ""}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Most likely to</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p>${this.sipNote()}</div>`);
  },
  rMeldReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, x = (rv.gs || []).find(m => Array.isArray(m.by) && m.by.includes(me)), pts = rv.d?.[me] || 0;
    const k = x ? x.by.indexOf(me) : -1, said = x ? x.by.map((pid, j) => (j === k ? "" : `${esc(this.nameOf(pid)?.[1] || "?")}: “${esc(x.a[j] || "nothing")}”`)).filter(Boolean).join(" · ") : "";
    const head = !x ? "Mind meld" : pts ? "Mind meld!" : x.a[k] ? "No match" : "No answer";
    paint(main, "meld-rev|" + H.rk, `<div class="card center result ${pts ? "good" : x ? "bad" : ""}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Mind meld</p><p class="ph-big">${head}</p>
      <p style="font-weight:800;font-size:19px">${pts ? `+${fmt(pts)} points. ` : ""}${said || "Look at the TV."}</p>${this.sipNote()}</div>`);
  },
  rImpReveal(main) {
    const H = this.host, rv = H.rv || {}, me = this.pid, imp = rv.o, pts = rv.d?.[me] || 0;
    const impName = esc(this.nameOf(imp)?.[1] || "Someone"), theirs = rv.x ? `“${esc(rv.x)}”` : "no word";
    let cls, head, sub;
    if (imp === me) { cls = rv.caught ? "bad" : "good"; head = rv.caught ? "You got caught" : "You got away!"; sub = `${rv.caught ? "" : `+${fmt(pts)} points. `}You had ${theirs}. Everyone else had “${esc(rv.w)}”.`; }
    else if (rv.g?.[me] === imp) { cls = "good"; head = "You spotted it!"; sub = `+${fmt(pts)} points. ${impName} had ${theirs}.`; }
    else { cls = "bad"; head = "Not quite"; sub = `It was ${impName}. They had ${theirs}; everyone else had “${esc(rv.w)}”.`; }
    const vip = H.vip === me, asked = this.cmd?.a === "next";
    paint(main, ["imp-rev", H.rk, vip, asked].join("|"), `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R} · Imposter</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:19px">${sub}</p>${this.sipNote()}</div>
      ${vip ? `<button class="btn primary wide" data-act="next-round" ${asked ? "disabled" : ""}>${asked ? "Moving on…" : "Next round"}</button>` : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start the next round.</p>`}`);
  },
  rReveal(main) {
    if (this.host.kind === "imp") return this.rImpReveal(main);
    if (this.host.kind === "fakin") return this.rFakinReveal(main);
    if (this.host.kind === "quip" || this.host.kind === "lash" || this.host.kind === "bluff") return this.rQuipReveal(main);
    if (this.host.kind === "likely") return this.rLikelyReveal(main);
    if (this.host.kind === "split") return this.rSplitReveal(main);
    if (this.host.kind === "draw") return this.rDrawReveal(main);
    if (this.host.kind === "low") return this.rLowReveal(main);
    if (this.host.kind === "shot") return this.rShotReveal(main);
    if (this.host.kind === "meld") return this.rMeldReveal(main);
    if (this.host.qz && this.host.rv) return this.rQuizReveal(main);
    const H = this.host, rv = H.rv || { g: {}, d: {} }, ownerP = this.nameOf(rv.o);
    const pts = rv.d?.[this.pid] || 0, mine = rv.g?.[this.pid];
    let cls = "", head = "", sub = "";
    if (rv.o === this.pid) {
      const fooled = Object.values(rv.g || {}).filter(x => x !== rv.o).length;
      cls = fooled ? "good" : ""; head = fooled ? `You fooled ${fooled}!` : "Nobody fell for it";
      sub = pts ? `+${fmt(pts)} points` : "No points this time.";
    } else if (mine && mine === rv.o) { cls = "good"; head = "Correct!"; sub = `+${fmt(pts)} points`; }
    else if (mine) { cls = "bad"; head = "Nope"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    else { head = "Too slow"; sub = `It was ${esc(ownerP?.[1] || "someone else")}.`; }
    paint(main, "rev|" + H.rk, `<div class="card center result ${cls}"><p class="eyebrow">${unitOf(H)} ${H.r} of ${H.R}</p><p class="ph-big">${head}</p><p style="font-weight:800;font-size:20px">${sub}</p>${this.sipNote()}</div>`);
  },
  rStandings(main) {
    const H = this.host, ps = this.pl().slice().sort((a, b) => b[3] - a[3]), me = this.me();
    const rank = me ? 1 + ps.filter(p => p[3] > me[3]).length : 0;
    const end = H.ph === "end", vip = H.vip === this.pid;
    if (end) this.prepShare("night|" + H.gid, () => SHARE.night(this.pl(), H.aw || [], H.best));
    paint(main, [H.ph, H.rk, H.gid, me?.[3], vip, !!this.cmd, JSON.stringify(H.aw || null), H.dare?.pid, H.dare?.t, end && this.shareReady("night|" + H.gid)].join("|"), `<div class="card center result ${end && rank === 1 ? "good" : ""}">
        <p class="eyebrow">${end ? "Final scores" : "Scores so far"}</p>
        <p class="ph-big">${me ? (end && rank === 1 ? "You win!" : ordinal(rank) + " place") : "Next game"}</p>
        ${me ? `<p style="font-weight:800;font-size:20px" class="num">${fmt(me[3])} points</p>` : ""}
        ${!end && H.dare?.pid === this.pid ? `<p class="eyebrow" style="margin-top:8px">A dare for you</p><p style="font-weight:800">${esc(cleanText(H.dare.t, 120))} Or pass, no shame.</p>` : ""}
        ${end ? (H.aw || []).filter(a => a[0] === this.pid).map(a => `<p class="eyebrow">Award: ${esc(a[1])}</p><p class="muted">${esc(a[2])}</p>`).join("") : ""}
        ${me && rank > 1 ? `<p class="muted">${fmt(ps[rank - 2][3] - me[3])} behind ${esc(ps[rank - 2][1])}</p>` : me && ps[1] && rank === 1 ? `<p class="muted">${fmt(me[3] - ps[1][3])} ahead of ${esc(ps[1][1])}</p>` : ""}
      </div>
      <ol class="phboard">${ps.map((p, i) => `<li class="${p[0] === this.pid ? "me" : ""}"><span class="num">${1 + ps.filter(q => q[3] > p[3]).length}</span>${faceA(p)}<span class="nm">${esc(p[1])}</span><b class="num">${fmt(p[3])}</b></li>`).join("")}</ol>
      ${end ? `<button class="btn wide blue" data-act="share-night">${this.shareReady("night|" + H.gid) ? "Share the night" : "Making your picture…"}</button>` : ""}
      ${end ? (vip ? `<button class="btn primary wide" data-act="again" ${this.cmd ? "disabled" : ""}>${this.cmd ? "Starting…" : "Play again"}</button>${(H.modes || []).includes("photo") ? `<p class="muted" style="text-align:center">Everyone picks new photos for the next game.</p>` : ""}`
        : `<p class="muted" style="text-align:center">Waiting for ${esc(this.nameOf(H.vip)?.[1] || "the host")} to start another game.</p>`) : ""}`);
  },
  renderClock() {
    const bar = $("#tbar"), H = this.host;
    // Draw it: whatever is drawn or typed goes in just before the clock runs out.
    if (H?.ph === "dw" && !H.pause && this.dr?.rk !== H.rk && this.deadline - Date.now() < 2500) { if (H.dw?.t?.[this.pid]?.[1] === "draw") this.sendDrawing(true); else this.sendGuess(); }
    if (!bar || !H || !["q", "qw", "qv", "fk-ans", "dw"].includes(H.ph) || (H.ph === "q" && (H.kind === "imp" || H.kind === "fakin")) || H.pause) return;
    const total = H.ph === "dw" ? ((H.dw?.s || 0) % 2 ? GUESS_SECS : DRAW_SECS) : H.ph === "qw" ? QW_SECS[H.kind] || Q_SECS : H.ph === "qv" ? QV_SECS[H.kind] || Q_SECS : H.ph === "fk-ans" ? FK_SECS : H.qd || Q_SECS;
    const left = Math.max(0, (this.deadline - Date.now()) / 1000);
    bar.style.width = Math.min(100, left / total * 100).toFixed(1) + "%";
  },
};

// ---------- events ----------
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "go-tv") return TV.start();
  if (a === "go-phone") return PH.start();
  if (mode === "tv") TV.act(a, b);
  else if (mode === "phone") { if (a === "join") e.preventDefault(); PH.act(a, b); }
});
app.addEventListener("change", e => {
  if (mode === "phone" && e.target.dataset.set) return PH.setting(e.target.dataset.set, e.target.value);
  if (mode !== "tv") return;
  if (e.target.id === "tune-sel") TV.setTune(e.target.value, e.target.selectedOptions[0]?.textContent);
  if (e.target.id === "face-sel") TV.setFaceCat(e.target.value);
  if (e.target.id === "theme-sel") TV.setTheme(e.target.value);
  if (e.target.id === "len-sel") TV.setLen(e.target.value);
  if (e.target.id === "imp-sel") TV.setImpVar(e.target.value);
  if (e.target.id === "snd-sel") TV.setSnd(e.target.value);
  if (e.target.id === "anon-sel") TV.setAnon(e.target.value);
  if (e.target.id === "host-sel") TV.setHost(e.target.value);
  if (e.target.id === "spicy-sel") TV.setSpicy(e.target.value);
  if (e.target.id === "drinks-sel") TV.setDrinks(e.target.value);
  if (e.target.id === "tw-sel") TV.setTwists(e.target.value);
  if (e.target.id === "diff-sel") TV.setDiff(e.target.value);
  if (e.target.tagName === "SELECT") TV.push(true); // phones show the same settings
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (mode === "phone" && e.target.id === "rx-form") return PH.sendReaction();
  if (mode === "tv" && e.target.id === "tune-form") return TV.setTune($("#tune-in")?.value, null);
  if (mode === "phone" && e.target.id === "song-form") return PH.searchSongs();
  if (mode === "phone" && e.target.classList.contains("qa-form")) return PH.sendQuip(Number(e.target.dataset.i));
  if (mode === "phone" && e.target.classList.contains("ttl-form")) return PH.sendTtl(!!e.submitter);
  if (mode === "phone" && e.target.classList.contains("num-form")) return PH.sendNum();
  if (mode === "phone" && e.target.classList.contains("fk-num-form")) return PH.sendFkNum();
  if (mode === "phone" && e.target.classList.contains("dw-form")) return PH.sendGuess();
  if (mode === "phone") PH.act("join");
});
$("#selfie-in").addEventListener("change", e => { const f = e.target.files?.[0]; if (f && mode === "phone") PH.setSelfie(f); });
fileIn.addEventListener("change", () => {
  const files = Array.from(fileIn.files || []);
  if (!files.length) return;
  if (mode === "tv") TV.addPhotos(files); else if (mode === "phone") PH.addPhotos(files);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode) wake(); });
// A new room code after the # (another QR code opened in the same tab) starts the page fresh.
addEventListener("hashchange", () => location.reload());

// Any picture that fails to load switches to its fallback (data-alt) when it has one.
document.addEventListener("error", e => {
  const im = e.target;
  if (im?.tagName === "IMG" && im.classList.contains("av-img")) return im.remove();
  if (im?.tagName === "IMG" && im.dataset.alt && im.src !== im.dataset.alt) { const alt = im.dataset.alt; im.dataset.alt = ""; im.src = alt; }
}, true);

// ---------- boot ----------
const last = store.get("wiw.mode");
if (location.pathname === "/tv") TV.start();
else if (hashCode) PH.start();
else if (last && Date.now() - (last.at || 0) < 4 * 3600e3 && (last.m === "tv" || last.m === "phone")) (last.m === "tv" ? TV : PH).start();
else if (ON_TV) TV.start();
else renderLanding();
})();
</script>
</body>
</html>
